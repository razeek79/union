    <!-- Font Awesome for icons -->

    <script>
    function isOfficial() {
        return localStorage.getItem('userRole') === 'official' || localStorage.getItem('userRole') === 'admin';
    }
    function hideDisabledNavBars() {
        if (isOfficial()) return;
        const disabled = (localStorage.getItem('disabledBars') ? JSON.parse(localStorage.getItem('disabledBars')) : []);
        if (disabled.includes('home')) document.querySelectorAll('a[href="main.html"]').forEach(el=>el.closest('li').style.display='none');
        if (disabled.includes('students-info')) document.querySelectorAll('a[href="students-info.html"]').forEach(el=>el.closest('li').style.display='none');
        if (disabled.includes('students-progress')) document.querySelectorAll('a[href="students-progress.html"]').forEach(el=>el.closest('li').style.display='none');
        if (disabled.includes('edit-exam-progress')) document.querySelectorAll('a[href="update-exam-progress.html"]').forEach(el=>el.closest('li').style.display='none');
        if (disabled.includes('our-council')) document.querySelectorAll('a[href="council.html"]').forEach(el=>el.closest('li').style.display='none');
        if (disabled.includes('follow-us')) document.querySelectorAll('a[href="follow-us.html"]').forEach(el=>el.closest('li').style.display='none');
    }
    document.addEventListener('DOMContentLoaded', hideDisabledNavBars);
    </script>
