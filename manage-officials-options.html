<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Manage Officials</title>
    <link rel="stylesheet" href="sc.css" />
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <!-- Supabase Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light fixed-top">
        <a class="navbar-brand" href="index.html"><img src="https://res.cloudinary.com/dh5jui6pu/image/upload/v1751959954/Screenshot_2025-07-08_130148_kg3qdg.png" class="navimg" /></a>
    </nav>

    <div class="container" style="margin-top:120px;">
        <div class="row">
            <div class="col-12">
                <h3 class="mb-4 text-center">Manage Officials</h3>
                
                <!-- Add Official Bar -->
                <a href="add-official.html" style="text-decoration: none; color: inherit;">
                    <div class="card students-card mb-3" style="cursor: pointer; transition: transform 0.2s;"
                         onmouseover="this.style.transform='scale(1.02)'" 
                         onmouseout="this.style.transform='scale(1)'">
                        <div class="card-body">
                            <h5 class="mb-0">Add Official</h5>
                        </div>
                    </div>
                </a>
                
                <!-- Remove Official Bar -->
                <a href="#" onclick="showRemoveOfficials(); return false;" style="text-decoration: none; color: inherit;">
                    <div class="card students-card" style="cursor: pointer; transition: transform 0.2s;"
                         onmouseover="this.style.transform='scale(1.02)'" 
                         onmouseout="this.style.transform='scale(1)'">
                        <div class="card-body">
                            <h5 class="mb-0">Remove Official</h5>
                        </div>
                    </div>
                </a>
                
                <!-- Officials List (shown when Remove Official is clicked) -->
                <div id="officialsListSection" style="display:none;" class="mt-4">
                    <div class="card students-card">
                        <div class="card-header bg-danger text-white">
                            <h5 class="mb-0">Select Official to Remove</h5>
                        </div>
                        <div class="card-body">
                            <div id="officialsList" class="list-group">Loading...</div>
                        </div>
                    </div>
                </div>
                
                <!-- Back Button -->
                <a href="chief-admin-main.html" class="btn btn-secondary btn-block mt-3">Back</a>
            </div>
        </div>
    </div>

    <script>
        function showRemoveOfficials(){
            const container = document.getElementById('officialsListSection');
            // Toggle visibility
            if (container.style.display === 'none') {
                container.style.display = 'block';
                renderOfficials();
            } else {
                container.style.display = 'none';
            }
        }
        
        async function renderOfficials(){
            const container = document.getElementById('officialsList');
            container.innerHTML = '<p class="text-muted text-center">Loading officials from database...</p>';

            // Fetch from Supabase
            const { data: list, error } = await supabase
                .from('officials')
                .select('id, username, role');

            if (error) {
                container.innerHTML = `<p class="text-danger">Error: ${error.message}</p>`;
                return;
            }
            
            if(!list || list.length === 0){ 
                container.innerHTML='<p class="text-muted text-center">No officials found.</p>'; 
                return; 
            }
            
            let html = '';
            list.forEach(official => {
                // Don't allow removing the Chief Admin (yourself)
                if (official.role === 'chief_admin') return;

                html += `
                    <div class="list-group-item d-flex justify-content-between align-items-center">
                        <div>
                            <strong>${official.username}</strong> 
                            <span class="badge badge-info ml-2">${official.role}</span>
                        </div>
                        <button class="btn btn-danger btn-sm" onclick="removeOfficial('${official.id}', '${official.username}')">
                            <i class="fas fa-trash"></i> Remove
                        </button>
                    </div>
                `;
            });
            
            if (html === '') {
                 html = '<p class="text-muted text-center">No other officials to remove.</p>';
            }

            container.innerHTML = html;
        }
        
        async function removeOfficial(id, username){
            if(confirm(`Are you sure you want to remove official "${username}"?\n\nThis will revoke their access immediately.`)){
                
                // Delete from 'officials' table
                const { error } = await supabase
                    .from('officials')
                    .delete()
                    .eq('id', id);
                
                if (error) {
                    alert("Error removing official: " + error.message);
                } else {
                    alert(`${username} has been removed.`);
                    renderOfficials(); // Refresh the list
                }
            }
        }
    </script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</body>
</html>
