<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Manage Officials</title>
    <link rel="stylesheet" href="sc.css" />
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light fixed-top">
        <a class="navbar-brand" href="index.html"><img src="https://res.cloudinary.com/dh5jui6pu/image/upload/v1751959954/Screenshot_2025-07-08_130148_kg3qdg.png" class="navimg" /></a>
    </nav>

    <div class="container" style="margin-top:120px;">
        <div class="row">
            <div class="col-12">
                <h3 class="mb-4 text-center">Manage Officials</h3>
                
                <!-- Add Official Bar -->
                <a href="add-official.html" style="text-decoration: none; color: inherit;">
                    <div class="card students-card mb-3" style="cursor: pointer; transition: transform 0.2s;"
                         onmouseover="this.style.transform='scale(1.02)'" 
                         onmouseout="this.style.transform='scale(1)'">
                        <div class="card-body">
                            <h5 class="mb-0">Add Official</h5>
                        </div>
                    </div>
                </a>
                
                <!-- Remove Official Bar -->
                <a href="#" onclick="showRemoveOfficials(); return false;" style="text-decoration: none; color: inherit;">
                    <div class="card students-card" style="cursor: pointer; transition: transform 0.2s;"
                         onmouseover="this.style.transform='scale(1.02)'" 
                         onmouseout="this.style.transform='scale(1)'">
                        <div class="card-body">
                            <h5 class="mb-0">Remove Official</h5>
                        </div>
                    </div>
                </a>
                
                <!-- Officials List (shown when Remove Official is clicked) -->
                <div id="officialsListSection" style="display:none;" class="mt-4">
                    <div class="card students-card">
                        <div class="card-header">
                            <h5>Select Official to Remove</h5>
                        </div>
                        <div class="card-body">
                            <div id="officialsList"></div>
                        </div>
                    </div>
                </div>
                
                <!-- Back Button -->
                <a href="chief-admin-main.html" class="btn btn-secondary btn-block mt-3">Back</a>
            </div>
        </div>
    </div>

    <script>
        function getRKUsers(){const v=localStorage.getItem('rkUsers'); return v?JSON.parse(v):[]}
        function saveRKUsers(l){localStorage.setItem('rkUsers',JSON.stringify(l));}
        
        function showRemoveOfficials(){
            const container = document.getElementById('officialsListSection');
            container.style.display = container.style.display === 'none' ? 'block' : 'none';
            if(container.style.display === 'block'){
                renderOfficials();
            }
        }
        
        function renderOfficials(){
            const list=getRKUsers();
            const container=document.getElementById('officialsList');
            if(!list.length){ 
                container.innerHTML='<p class="text-muted">No officials yet.</p>'; 
                return; 
            }
            
            let html = '';
            list.forEach(official => {
                html += `
                    <div class="card mb-2">
                        <div class="card-body d-flex justify-content-between align-items-center">
                            <div>
                                <strong>${official.username}</strong> - ${official.role}
                            </div>
                            <button class="btn btn-danger btn-sm" onclick="removeOfficial('${official.username}')">Remove</button>
                        </div>
                    </div>
                `;
            });
            
            container.innerHTML = html;
        }
        
        function removeOfficial(username){
            if(confirm(`Are you sure you want to remove ${username}?`)){
                const list = getRKUsers();
                const filtered = list.filter(o => o.username !== username);
                saveRKUsers(filtered);
                alert(`${username} has been removed.`);
                renderOfficials();
            }
        }
    </script>
</body>
</html>
