<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Edit/Remove Official</title>
    <link rel="stylesheet" href="sc.css" />
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
    <div class="container" style="margin-top:120px; max-width:720px;">
        <div class="row">
            <div class="col-12">
                <div class="btn-group btn-group-toggle d-flex" data-toggle="buttons" style="width:100%;">
                    <label class="btn btn-outline-primary active w-50" id="tabChange">
                        <input type="radio" name="options" autocomplete="off" checked> Change Password
                    </label>
                    <label class="btn btn-outline-secondary w-50" id="tabDelete">
                        <input type="radio" name="options" autocomplete="off"> Remove Official
                    </label>
                </div>
            </div>
        </div>

        <div id="changeSection" class="mt-4">
            <div class="card students-card"><div class="card-body">
                <h5>Change Password</h5>
                <form id="changeForm">
                    <div class="form-group"><label>Username</label><input id="cUsername" class="form-control" /></div>
                    <div class="form-group"><label>Current Password</label><input id="cCurrent" type="password" class="form-control" /><div class="input-group-append"><button class="btn btn-outline-secondary" type="button" onclick="togglePassword('cCurrent');return false;"> <i id="cCurrent-eye" class="fas fa-eye"></i></button></div></div>
                    <div class="form-group"><label>New Password</label><input id="cNew" type="password" class="form-control" /><div class="input-group-append"><button class="btn btn-outline-secondary" type="button" onclick="togglePassword('cNew');return false;"> <i id="cNew-eye" class="fas fa-eye"></i></button></div></div>
                    <div class="form-group"><label>Confirm Password</label><input id="cConfirm" type="password" class="form-control" /><div class="input-group-append"><button class="btn btn-outline-secondary" type="button" onclick="togglePassword('cConfirm');return false;"> <i id="cConfirm-eye" class="fas fa-eye"></i></button></div></div>
                    <button class="btn btn-primary" type="submit">Change Password</button>
                </form>
            </div></div>
        </div>

        <div id="deleteSection" class="mt-4" style="display:none;">
            <div class="card students-card"><div class="card-body">
                <h5>Remove Official</h5>
                <form id="deleteForm">
                    <div class="form-group"><label>Username</label><input id="dUsername" class="form-control" /></div>
                    <div class="form-group"><label>Current Password</label><input id="dCurrent" type="password" class="form-control" /></div>
                    <button class="btn btn-danger" type="submit">Remove Official</button>
                </form>
            </div></div>
        </div>
    </div>

    <script>
        function getRKUsers(){const v=localStorage.getItem('rkUsers'); return v?JSON.parse(v):[]}
        function saveRKUsers(l){localStorage.setItem('rkUsers',JSON.stringify(l));}
        function togglePassword(id){const i=document.getElementById(id); const eye=document.getElementById(id+'-eye'); if(i.type==='password'){i.type='text'; if(eye){eye.classList.remove('fa-eye'); eye.classList.add('fa-eye-slash');}}else{ i.type='password'; if(eye){eye.classList.remove('fa-eye-slash'); eye.classList.add('fa-eye');}}}

        document.getElementById('tabChange').addEventListener('click', ()=>{document.getElementById('changeSection').style.display='block'; document.getElementById('deleteSection').style.display='none';});
        document.getElementById('tabDelete').addEventListener('click', ()=>{document.getElementById('changeSection').style.display='none'; document.getElementById('deleteSection').style.display='block';});

        document.getElementById('changeForm').addEventListener('submit', function(e){
            e.preventDefault();
            const u=document.getElementById('cUsername').value.trim();
            const cur=document.getElementById('cCurrent').value; const nw=document.getElementById('cNew').value; const cf=document.getElementById('cConfirm').value;
            if(!u||!cur||!nw||!cf){alert('Fill all');return}; if(nw!==cf){alert('New passwords do not match');return};
            const list=getRKUsers(); const idx=list.findIndex(x=>x.username===u && x.password===cur);
            if(idx===-1){alert('Invalid username or current password');return}; list[idx].password=nw; saveRKUsers(list); alert('Password changed'); this.reset();
        });

        document.getElementById('deleteForm').addEventListener('submit', function(e){
            e.preventDefault(); const u=document.getElementById('dUsername').value.trim(); const cur=document.getElementById('dCurrent').value; if(!u||!cur){alert('Fill all');return};
            const list=getRKUsers(); const idx=list.findIndex(x=>x.username===u && x.password===cur); if(idx===-1){alert('Invalid username or password');return}; if(confirm('Delete '+u+'?')){ list.splice(idx,1); saveRKUsers(list); alert('Deleted'); this.reset(); }
        });
    
    // Prefill username when opened from manage-officials list
    document.addEventListener('DOMContentLoaded', function() {
        const params = new URLSearchParams(window.location.search);
        const username = params.get('username');
        if (username) {
            const cu = document.getElementById('cUsername');
            const du = document.getElementById('dUsername');
            if (cu) { cu.value = username; cu.readOnly = true; }
            if (du) { du.value = username; du.readOnly = true; }
            // show change tab by default
            document.getElementById('changeSection').style.display = 'block';
            document.getElementById('deleteSection').style.display = 'none';
            // scroll into view
            document.getElementById('changeSection').scrollIntoView({behavior: 'smooth'});
        }
    });
    </script>
</body>
</html>
