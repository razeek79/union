<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manage Student Progress - الأبطال</title>
    <!-- Link to main CSS -->
    <link rel="stylesheet" href="sc.css" />
    <!-- Link to NEW Responsive CSS -->
    <link rel="stylesheet" href="manage-student-progress.css">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <!-- Supabase Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light fixed-top">
        <a class="navbar-brand" href="index.html"><img src="https://res.cloudinary.com/dh5jui6pu/image/upload/v1751959954/Screenshot_2025-07-08_130148_kg3qdg.png" class="navimg" style="height:40px;" /></a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" style="width: 60px;">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ml-auto">
                <li class="nav-item"><a class="nav-link" href="main.html">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="students-info.html">Students Info</a></li>
                <li class="nav-item active"><a class="nav-link" href="students-progress.html">Students Progress</a></li>
                <li class="nav-item"><a class="nav-link" href="council.html">Our Council</a></li>
            </ul>
        </div>
    </nav>

    <div class="container mt-5" style="margin-top: 100px !important;">
        
        <!-- Login Section -->
        <div id="loginSection">
            <div class="row justify-content-center">
                <div class="col-12 col-md-6 col-lg-5">
                    <div class="card students-card p-3">
                        <div class="card-body">
                            <div class="text-center mb-4">
                                <div class="students-icon mb-3">
                                    <i class="fas fa-chart-line fa-3x"></i>
                                </div>
                                <h3 class="card-title">Manage Progress Login</h3>
                                <p class="text-muted small">Students: Enter CIC No.<br>Officials: Enter Username</p>
                            </div>

                            <form id="loginFormPage">
                                <div class="form-group">
                                    <label>Username</label>
                                    <input type="text" class="form-control" id="pageUsername" placeholder="Username / CIC No." required>
                                </div>

                                <div class="form-group">
                                    <label>Password</label>
                                    <div class="input-group">
                                        <input type="password" class="form-control" id="pagePassword" placeholder="Password" required>
                                        <div class="input-group-append">
                                            <button class="btn btn-outline-secondary" type="button" onclick="togglePassword('pagePassword')">
                                                <i class="fas fa-eye" id="pagePassword-eye"></i>
                                            </button>
                                        </div>
                                    </div>
                                </div>

                                <button type="submit" class="btn btn-primary btn-lg btn-block mt-4">Login</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>

            <div class="row mt-4">
                <div class="col-12 text-center">
                    <a href="students-progress.html" class="btn btn-secondary">Back</a>
                </div>
            </div>
        </div>

        <!-- Main Content -->
        <div id="mainContent" style="display: none;">
            <div class="row">
                <div class="col-12">
                    <h1 class="text-center mb-3">Manage Student Progress</h1>
                    <div class="text-center mb-4">
                        <span class="badge badge-success p-2" id="loggedInUser"></span>
                        <button class="btn btn-sm btn-outline-danger ml-2" onclick="logout()">Logout</button>
                        <div class="mt-3">
                            <button onclick="window.location.href='bulk-upload-results.html';" class="btn btn-warning text-dark btn-sm font-weight-bold">
                                <i class="fas fa-file-upload"></i> Bulk Upload Results
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Search and Refresh -->
            <div class="row mb-4">
                <div class="col-12 col-md-8 mb-2 mb-md-0">
                    <input type="text" class="form-control" id="searchInput" placeholder="Search by CIC No. or Name...">
                </div>
                <div class="col-12 col-md-4 text-right">
                    <button class="btn btn-primary btn-block" onclick="refreshStudents()">
                        <i class="fas fa-sync-alt"></i> Refresh
                    </button>
                </div>
            </div>

            <!-- Count -->
            <div class="row mb-3">
                <div class="col-12">
                    <div class="alert alert-info py-2">
                        <i class="fas fa-users"></i> <strong>Total Students:</strong> <span id="studentCount">0</span>
                    </div>
                </div>
            </div>

            <!-- Header Row (Hidden on Mobile via CSS) -->
            <div class="row mb-2 header-row">
                <div class="col-12">
                    <div class="card students-card" style="background-color: #f1f5fb;">
                        <div class="card-body py-2">
                            <div class="row align-items-center font-weight-bold text-center table-head">
                                <div class="col-2">SL No.</div>
                                <div class="col-3">CIC No.</div>
                                <div class="col-5">Name</div>
                                <div class="col-2">Action</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Students List -->
            <div class="row" id="studentsList">
                <div class="col-12 text-center text-muted py-5">Loading...</div>
            </div>

            <!-- Back Button -->
            <div class="row mt-5 mb-5">
                <div class="col-12 text-center">
                    <a href="students-progress.html" class="btn btn-secondary btn-lg">Back to Students Progress</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        const supabaseUrl = 'https://ewpmkjqcjnhtxyfqgiba.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV3cG1ranFjam5odHh5ZnFnaWJhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjIzMTUyOTMsImV4cCI6MjA3Nzg5MTI5M30.i1ivEtua8fCktdit_DASxQigFg2Kb8NLn0WLLQ3LFmI';
        const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

        const PASSWORD_SUFFIX = "_ALABTHAL";
        let studentsCache = [];

        // --- 1. LOGIN LOGIC ---
        document.getElementById('loginFormPage').addEventListener('submit', async function(e) {
            e.preventDefault();
            const username = document.getElementById('pageUsername').value.trim();
            const password = document.getElementById('pagePassword').value;

            try {
                // A. Chief Admin
                if (username === 'Razeek Fariz') {
                    const { data, error } = await supabase.auth.signInWithPassword({ email: 'razeekfariz1@gmail.com', password });
                    if (error) throw error;
                    return setupSession(username, 'chief_admin');
                }

                // B. Student (Redirect)
                const cleanName = username.replace(/\s+/g, '').toLowerCase();
                let { data: stuData, error: stuError } = await supabase.auth.signInWithPassword({ 
                    email: cleanName + '@student.com', 
                    password: password + PASSWORD_SUFFIX 
                });
                
                if (!stuError) {
                    alert(`Welcome Student ${username}! Redirecting...`);
                    window.location.href = `edit-student-progress.html?cicNo=${username}`; 
                    return;
                }

                // C. Official (Dashboard)
                let { data: offData, error: offError } = await supabase.auth.signInWithPassword({ 
                    email: cleanName + '@official.com', 
                    password: password 
                });
                
                if (!offError) {
                    const { data: official } = await supabase.from('officials').select('role').eq('id', offData.user.id).single();
                    return setupSession(username, official ? official.role : 'official');
                }

                throw new Error("Invalid username or password");

            } catch (err) {
                alert("Login Failed: " + err.message);
            }
        });

        function setupSession(name, role) {
            localStorage.setItem('mgmtUser', name);
            localStorage.setItem('mgmtUserRole', role);
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('mainContent').style.display = 'block';
            document.getElementById('loggedInUser').textContent = `${name} (${role})`;
            refreshStudents();
        }

        // --- 2. ADMIN VIEW ---
        async function refreshStudents() {
            document.getElementById('studentsList').innerHTML = '<div class="col-12 text-center text-muted py-5">Loading students...</div>';
            
            const { data, error } = await supabase
                .from('students')
                .select('cic_no, full_name')
                .order('cic_no');

            if (error) {
                document.getElementById('studentsList').innerHTML = '<div class="col-12 text-danger text-center">Error loading data</div>';
                return;
            }

            studentsCache = data || [];
            renderStudentList(studentsCache);
        }

        function renderStudentList(list) {
            const container = document.getElementById('studentsList');
            document.getElementById('studentCount').textContent = list.length;

            if (list.length === 0) {
                container.innerHTML = '<div class="col-12 text-center text-muted py-5">No students found.</div>';
                return;
            }

            let html = '';
            list.forEach((s, index) => {
                html += `
                <div class="col-12 mb-2">
                    <div class="card students-card">
                        <div class="card-body py-2">
                            <div class="row align-items-center text-center">
                                <!-- Data Labels added for Mobile View via CSS -->
                                <div class="col-2" data-label="SL No.">
                                    <h5>${index + 1}</h5>
                                </div>
                                <div class="col-3" data-label="CIC No.">
                                    <h5>${s.cic_no}</h5>
                                </div>
                                <div class="col-5" data-label="Name">
                                    <h5>${s.full_name}</h5>
                                </div>
                                <div class="col-2 text-center">
                                    <!-- SMALL ICON BUTTON -->
                                    <button class="btn btn-warning btn-sm shadow-sm icon-only-btn" onclick="window.location.href='edit-student-progress.html?cicNo=${s.cic_no}'" title="Edit">
                                        <i class="fas fa-edit"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>`;
            });
            container.innerHTML = html;
        }

        document.getElementById('searchInput').addEventListener('input', function(e) {
            const term = e.target.value.toLowerCase();
            const filtered = studentsCache.filter(s => 
                s.cic_no.toLowerCase().includes(term) || 
                s.full_name.toLowerCase().includes(term)
            );
            renderStudentList(filtered);
        });

        window.logout = async function() {
            await supabase.auth.signOut();
            localStorage.removeItem('mgmtUser');
            localStorage.removeItem('mgmtUserRole');
            location.reload();
        };

        window.togglePassword = function(id) {
            const input = document.getElementById(id);
            input.type = input.type === 'password' ? 'text' : 'password';
        };

        document.addEventListener('DOMContentLoaded', function() {
            const user = localStorage.getItem('mgmtUser');
            if (user) {
                const role = localStorage.getItem('mgmtUserRole');
                setupSession(user, role);
            }
        });

        document.getElementById('rkLogo').addEventListener('click', function() {
            window.location.href = 'rk-login.html';
        });
    </script>
</body>
</html>
