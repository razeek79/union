<html>

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="sc.css" />
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light fixed-top">

        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ml-auto">
                <li class="nav-item"><a class="nav-link" href="main.html">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="students-info.html">Students Info</a></li>
                <li class="nav-item active"><a class="nav-link" href="change-password.html">Change Password</a></li>
                <li class="nav-item"><a class="nav-link" href="students-progress.html">Students Progress</a></li>
                <li class="nav-item"><a class="nav-link" href="council.html">Our Council</a></li>
                <li class="nav-item"><a class="nav-link" href="follow-us.html">Follow us</a></li>
            </ul>
        </div>
    </nav>

    <div class="container mt-5" style="margin-top: 100px !important;">
        <div class="row">
            <div class="col-12">
                <h1 class="text-center mb-5" style="font-family: Almarai; color: #02244e;">Change Student Password</h1>
            </div>
        </div>

        <div id="officialModeBanner" class="alert alert-success text-center" style="display: none;">
            <i class="fas fa-user-shield"></i> <strong>Official Access:</strong> You can reset passwords without knowing the old one.
        </div>

        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">
                <div class="card students-card">
                    <div class="card-body">
                        <div class="text-center mb-4">
                            <div class="students-icon mb-3">
                                <i class="fas fa-key" style="font-size: 3rem; color: #02244e;"></i>
                            </div>
                            <h3 class="card-title" style="font-family: Almarai; color: #02244e;">Password Change Form</h3>
                        </div>
                        
                        <form id="changePasswordForm">
                            <div class="form-group">
                                <label>CIC No.</label>
                                <input type="text" class="form-control" id="cicNo" placeholder="Enter CIC Number" required>
                            </div>
                            
                            <div class="form-group">
                                <label>Student Name</label>
                                <input type="text" class="form-control" id="studentName" placeholder="Enter student name" required>
                            </div>
                            
                            <div class="form-group" id="oldPasswordGroup">
                                <label>Old Password</label>
                                <div class="input-group">
                                    <input type="password" class="form-control" id="oldPassword" placeholder="Enter current password">
                                    <div class="input-group-append">
                                        <button class="btn btn-outline-secondary" type="button" onclick="togglePassword('oldPassword')">
                                            <i class="fas fa-eye" id="oldPassword-eye"></i>
                                        </button>
                                    </div>
                                </div>
                            </div>
                            
                            <div class="form-group">
                                <label>New Password</label>
                                <div class="input-group">
                                    <input type="password" class="form-control" id="newPassword" placeholder="Enter new password" required>
                                    <div class="input-group-append">
                                        <button class="btn btn-outline-secondary" type="button" onclick="togglePassword('newPassword')">
                                            <i class="fas fa-eye" id="newPassword-eye"></i>
                                        </button>
                                    </div>
                                </div>
                                <small class="form-text text-muted">Must be at least 6 characters</small>
                            </div>
                            
                            <div class="form-group">
                                <label>Confirm New Password</label>
                                <div class="input-group">
                                    <input type="password" class="form-control" id="confirmPassword" placeholder="Confirm new password" required>
                                    <div class="input-group-append">
                                        <button class="btn btn-outline-secondary" type="button" onclick="togglePassword('confirmPassword')">
                                            <i class="fas fa-eye" id="confirmPassword-eye"></i>
                                        </button>
                                    </div>
                                </div>
                            </div>
                            
                            <button type="submit" class="btn btn-info btn-lg btn-block" style="font-family: Almarai;">
                                <i class="fas fa-save"></i> <span id="submitBtnText">Change Password</span>
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <div class="row mt-4">
            <div class="col-12 text-center">
                <a href="students-info.html" class="btn btn-secondary btn-lg">Back to Students Info</a>
            </div>
        </div>
    </div>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <script>
        const supabaseUrl = 'https://ewpmkjqcjnhtxyfqgiba.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV3cG1ranFjam5odHh5ZnFnaWJhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjIzMTUyOTMsImV4cCI6MjA3Nzg5MTI5M30.i1ivEtua8fCktdit_DASxQigFg2Kb8NLn0WLLQ3LFmI';
        const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

        let isOfficial = false;

        // Initialize: Check if current user is an Official (Admin/Mentor)
        async function initPage() {
            const { data: { session } } = await supabase.auth.getSession();
            
            if (session) {
                // Check officials table
                const { data: official } = await supabase
                    .from('officials')
                    .select('role')
                    .eq('id', session.user.id)
                    .single();

                if (official) {
                    isOfficial = true;
                    // Enable "Admin Mode": Hide old password, change button text
                    document.getElementById('officialModeBanner').style.display = 'block';
                    document.getElementById('oldPasswordGroup').style.display = 'none';
                    document.getElementById('submitBtnText').textContent = "Reset Password (Official)";
                }
            }
        }

        document.getElementById('changePasswordForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const cicNo = document.getElementById('cicNo').value.trim();
            const name = document.getElementById('studentName').value.trim();
            const newPass = document.getElementById('newPassword').value;
            const confirmPass = document.getElementById('confirmPassword').value;
            const oldPass = document.getElementById('oldPassword').value;

            if (newPass !== confirmPass) return alert('New passwords do not match.');
            if (newPass.length < 6) return alert('Password must be 6+ characters.');

            try {
                // 1. Find Student UUID from CIC & Name
                const { data: student, error: findError } = await supabase
                    .from('students')
                    .select('id, full_name')
                    .eq('cic_no', cicNo)
                    .ilike('full_name', name) // Case-insensitive name check
                    .single();

                if (findError || !student) {
                    throw new Error("Student not found. Please check CIC No. and Name spelling.");
                }

                if (isOfficial) {
                    // --- SCENARIO A: ADMIN RESET ---
                    // Use the RPC function to force-reset
                    const { error: rpcError } = await supabase.rpc('reset_user_password', {
                        target_user_id: student.id,
                        new_password: newPass
                    });

                    if (rpcError) throw rpcError;
                    alert(`Success! Password for ${student.full_name} has been reset.`);

                } else {
                    // --- SCENARIO B: STUDENT SELF-CHANGE ---
                    if (!oldPass) throw new Error("Please enter your Old Password.");

                    // We must sign in as the student to change their password
                    // Note: This creates a temporary session for the student
                    const email = cicNo.toLowerCase() + '@student.com';
                    
                    const { data: signInData, error: signInError } = await supabase.auth.signInWithPassword({
                        email: email,
                        password: oldPass
                    });

                    if (signInError) throw new Error("Incorrect Old Password.");

                    // Update password
                    const { error: updateError } = await supabase.auth.updateUser({
                        password: newPass
                    });

                    if (updateError) throw updateError;

                    alert("Password Changed Successfully!");
                    
                    // Sign the student out (so the form resets)
                    await supabase.auth.signOut();
                }

                // Cleanup
                document.getElementById('changePasswordForm').reset();

            } catch (err) {
                alert("Error: " + err.message);
            }
        });

        window.togglePassword = function(id) {
            const input = document.getElementById(id);
            input.type = input.type === 'password' ? 'text' : 'password';
        };

        initPage();
    </script>
</body>
</html>
