<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Change Password - الأبطال</title>
    <link rel="stylesheet" href="sc.css" />
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Font Awesome for Eye Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light fixed-top">
        <a class="navbar-brand" href="index.html"><img src="https://res.cloudinary.com/dh5jui6pu/image/upload/v1751959954/Screenshot_2025-07-08_130148_kg3qdg.png" class="navimg" /></a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ml-auto">
                <li class="nav-item"><a class="nav-link" href="main.html">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="students-info.html">Students Info</a></li>
                <li class="nav-item active"><a class="nav-link" href="change-password.html">Change Password</a></li>
                <li class="nav-item"><a class="nav-link" href="students-progress.html">Students Progress</a></li>
                <li class="nav-item"><a class="nav-link" href="council.html">Our Council</a></li>
                <li class="nav-item"><a class="nav-link" href="follow-us.html">Follow us</a></li>
            </ul>
        </div>
    </nav>

    <div class="container mt-5" style="margin-top: 100px !important;">
        <div class="row">
            <div class="col-12">
                <h1 class="text-center mb-5" style="font-family: Almarai; color: #02244e;">Change Student Password</h1>
            </div>
        </div>

        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">
                <div class="card students-card">
                    <div class="card-body">
                        <div class="text-center mb-4">
                            <div class="students-icon mb-3">
                                <i class="fas fa-key" style="font-size: 3rem; color: #02244e;"></i>
                            </div>
                            <h3 class="card-title" style="font-family: Almarai; color: #02244e;">Password Change Form</h3>
                            <p class="text-muted">Enter your details to update your password</p>
                        </div>
                        
                        <form id="changePasswordForm">
                            <!-- CIC No -->
                            <div class="form-group">
                                <label>CIC No.</label>
                                <input type="text" class="form-control" id="cicNo" placeholder="Enter CIC Number (e.g. 10)" required>
                            </div>

                            <!-- Current Password -->
                            <div class="form-group">
                                <label>Current Password</label>
                                <div class="input-group">
                                    <input type="password" class="form-control" id="currentPassword" placeholder="Enter current password" required>
                                    <div class="input-group-append">
                                        <button class="btn btn-outline-secondary" type="button" onclick="togglePassword('currentPassword')">
                                            <i class="fas fa-eye" id="currentPassword-eye"></i>
                                        </button>
                                    </div>
                                </div>
                            </div>
                            
                            <!-- New Password -->
                            <div class="form-group">
                                <label>New Password</label>
                                <div class="input-group">
                                    <input type="password" class="form-control" id="newPassword" placeholder="Enter new password" required>
                                    <div class="input-group-append">
                                        <button class="btn btn-outline-secondary" type="button" onclick="togglePassword('newPassword')">
                                            <i class="fas fa-eye" id="newPassword-eye"></i>
                                        </button>
                                    </div>
                                </div>
                                <small class="form-text text-muted">Minimum 4 characters</small>
                            </div>
                            
                            <!-- Confirm New Password -->
                            <div class="form-group">
                                <label>Confirm New Password</label>
                                <div class="input-group">
                                    <input type="password" class="form-control" id="confirmPassword" placeholder="Confirm new password" required>
                                    <div class="input-group-append">
                                        <button class="btn btn-outline-secondary" type="button" onclick="togglePassword('confirmPassword')">
                                            <i class="fas fa-eye" id="confirmPassword-eye"></i>
                                        </button>
                                    </div>
                                </div>
                            </div>
                            
                            <button type="submit" class="btn btn-info btn-lg btn-block" style="font-family: Almarai;">
                                <i class="fas fa-save"></i> Change Password
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <div class="row mt-4">
            <div class="col-12 text-center">
                <a href="students-info.html" class="btn btn-secondary btn-lg">Back to Students Info</a>
            </div>
        </div>
    </div>

    <script>
        const supabaseUrl = 'https://ewpmkjqcjnhtxyfqgiba.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV3cG1ranFjam5odHh5ZnFnaWJhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjIzMTUyOTMsImV4cCI6MjA3Nzg5MTI5M30.i1ivEtua8fCktdit_DASxQigFg2Kb8NLn0WLLQ3LFmI';
        const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

        // SECRET SUFFIX
        const PASSWORD_SUFFIX = "_ALABTHAL";

        document.getElementById('changePasswordForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const cicNo = document.getElementById('cicNo').value.trim();
            const currentPass = document.getElementById('currentPassword').value;
            const newPass = document.getElementById('newPassword').value;
            const confirmPass = document.getElementById('confirmPassword').value;

            if (newPass !== confirmPass) return alert('New passwords do not match.');
            if (newPass.length < 4) return alert('New password must be at least 4 characters.');

            // 1. Construct Email
            const email = cicNo.toLowerCase() + '@student.com';

            // 2. Apply Suffix
            const finalCurrentPass = currentPass + PASSWORD_SUFFIX;
            const finalNewPass = newPass + PASSWORD_SUFFIX;

            try {
                // Step A: Verify Credentials by Signing In
                // Note: This creates a temporary session
                const { data, error: signInError } = await supabase.auth.signInWithPassword({
                    email: email,
                    password: finalCurrentPass
                });

                if (signInError) {
                    alert("Incorrect CIC No. or Current Password.");
                    return;
                }

                // Step B: Update Password
                const { error: updateError } = await supabase.auth.updateUser({
                    password: finalNewPass
                });

                if (updateError) throw updateError;

                alert("Password Changed Successfully! Please login again with your new password.");
                
                // Clean up session
                await supabase.auth.signOut();
                
                // Reset form
                document.getElementById('changePasswordForm').reset();

            } catch (err) {
                alert("Error: " + err.message);
            }
        });

        window.togglePassword = function(id) {
            const input = document.getElementById(id);
            const eyeIcon = document.getElementById(id + '-eye');
            if (input.type === 'password') {
                input.type = 'text';
                if(eyeIcon) { eyeIcon.classList.remove('fa-eye'); eyeIcon.classList.add('fa-eye-slash'); }
            } else {
                input.type = 'password';
                if(eyeIcon) { eyeIcon.classList.remove('fa-eye-slash'); eyeIcon.classList.add('fa-eye'); }
            }
        };
    </script>
</body>
</html>
