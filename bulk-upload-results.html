<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bulk Upload Results - الأبطال</title>
    <link rel="stylesheet" href="sc.css">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <!-- Supabase & Excel Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
    <style>
        .step-card {
            border: 1px solid #e0e0e0;
            border-left: 5px solid #02244e;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            background: #fff;
        }
        .step-num {
            background: #02244e; color: white; width: 30px; height: 30px;
            border-radius: 50%; display: inline-block; text-align: center;
            line-height: 30px; font-weight: bold; margin-right: 10px;
        }
        .log-area {
            background: #1e1e1e; color: #0f0; font-family: monospace;
            padding: 15px; border-radius: 5px; height: 200px; overflow-y: auto;
            font-size: 0.9rem; display: none;
        }
        .log-success { color: #4caf50; }
        .log-error { color: #f44336; }
        .log-warn { color: #ff9800; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light fixed-top">
        <a class="navbar-brand" href="index.html"><img src="https://res.cloudinary.com/dh5jui6pu/image/upload/v1751959954/Screenshot_2025-07-08_130148_kg3qdg.png" class="navimg" /></a>
    </nav>

    <div class="container" style="margin-top: 100px; max-width: 900px;">
        <h2 class="text-center mb-4" style="color: #02244e; font-family: Almarai;">Bulk Upload Results</h2>

        <!-- Step 1: Select Semester -->
        <div class="step-card">
            <h4><span class="step-num">1</span> Select Target Semester</h4>
            <div class="row mt-3">
                <div class="col-md-6">
                    <div class="form-group">
                        <label>Course Type</label>
                        <select id="courseType" class="form-control" onchange="updateSemesterOptions()">
                            <option value="">-- Select Course --</option>
                            <option value="wafy">Wafy (Thamheediyya / Aliya)</option>
                            <option value="degree">Degree</option>
                            <option value="highersec">Higher Secondary</option>
                        </select>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="form-group">
                        <label>Semester</label>
                        <select id="semesterSelect" class="form-control" disabled>
                            <option value="">-- Select Course First --</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>

        <!-- Step 2: Download Template -->
        <div class="step-card">
            <h4><span class="step-num">2</span> Prepare Data</h4>
            <p class="text-muted">Download the template. Ensure <strong>CIC No</strong> is in the first column.</p>
            <button class="btn btn-info" onclick="downloadTemplate()">
                <i class="fas fa-download"></i> Download Excel Template
            </button>
        </div>

        <!-- Step 3: Upload -->
        <div class="step-card">
            <h4><span class="step-num">3</span> Upload & Process</h4>
            <div class="custom-file mb-3">
                <input type="file" class="custom-file-input" id="excelFile" accept=".xlsx, .xls" onchange="updateFileName()">
                <label class="custom-file-label" for="excelFile" id="fileLabel">Choose Excel file...</label>
            </div>
            <button class="btn btn-success btn-block btn-lg" onclick="processBulkUpload()">
                <i class="fas fa-cloud-upload-alt"></i> Start Bulk Upload
            </button>
        </div>

        <!-- Log Output -->
        <div class="log-area" id="consoleLog"></div>
        
        <div class="text-center mt-4 mb-5">
            <a href="update-exam-progress.html" class="btn btn-secondary">Back to Exam Menu</a>
        </div>
    </div>

    <script>
        // --- CONFIGURATION ---
        const CONFIG = {
            wafy: {
                columns: ["CIC No", "Subject", "CE Mark", "CE Max", "TE Mark", "TE Max", "Total", "Max", "Status", "Exam Mode"],
                keys:    ["cic_no", "subject", "ce_mark", "ce_max", "te_mark", "te_max", "total", "max", "status", "exam_mode"],
                sems: [
                    {k: 'wafy_thamheediyya_sem1', v: 'Thamheediyya Sem 1'}, {k: 'wafy_thamheediyya_sem2', v: 'Thamheediyya Sem 2'},
                    {k: 'wafy_thamheediyya_sem3', v: 'Thamheediyya Sem 3'}, {k: 'wafy_thamheediyya_sem4', v: 'Thamheediyya Sem 4'},
                    {k: 'wafy_aliya_sem1', v: 'Aliya Sem 1'}, {k: 'wafy_aliya_sem2', v: 'Aliya Sem 2'},
                    {k: 'wafy_aliya_sem3', v: 'Aliya Sem 3'}, {k: 'wafy_aliya_sem4', v: 'Aliya Sem 4'},
                    {k: 'wafy_aliya_sem5', v: 'Aliya Sem 5'}, {k: 'wafy_aliya_sem6', v: 'Aliya Sem 6'},
                    {k: 'wafy_aliya_sem7', v: 'Aliya Sem 7'}, {k: 'wafy_aliya_sem8', v: 'Aliya Sem 8'}
                ]
            },
            degree: {
                columns: ["CIC No", "Subject", "Credits", "Grade", "Credit Point", "Status"],
                keys:    ["cic_no", "subject", "credits", "grade", "credit_point", "status"],
                sems: [
                    {k: 'degree_sem1', v: 'Degree Sem 1'}, {k: 'degree_sem2', v: 'Degree Sem 2'},
                    {k: 'degree_sem3', v: 'Degree Sem 3'}, {k: 'degree_sem4', v: 'Degree Sem 4'},
                    {k: 'degree_sem5', v: 'Degree Sem 5'}, {k: 'degree_sem6', v: 'Degree Sem 6'}
                ]
            },
            highersec: {
                columns: ["CIC No", "Subject", "CE Mark", "CE Max", "TE Mark", "TE Max", "Total", "Max"],
                keys:    ["cic_no", "subject", "ce_mark", "ce_max", "te_mark", "te_max", "total", "max"],
                sems: [
                    {k: 'highersec_plus1', v: 'Plus One'}, {k: 'highersec_plus2', v: 'Plus Two'}
                ]
            }
        };


        // --- UI FUNCTIONS ---
        function updateSemesterOptions() {
            const type = document.getElementById('courseType').value;
            const semSelect = document.getElementById('semesterSelect');
            semSelect.innerHTML = '<option value="">-- Select Semester --</option>';
            
            if (type && CONFIG[type]) {
                CONFIG[type].sems.forEach(sem => {
                    semSelect.innerHTML += `<option value="${sem.k}">${sem.v}</option>`;
                });
                semSelect.disabled = false;
            } else {
                semSelect.disabled = true;
            }
        }

        function updateFileName() {
            const input = document.getElementById('excelFile');
            const label = document.getElementById('fileLabel');
            label.textContent = input.files[0] ? input.files[0].name : 'Choose Excel file...';
        }

        function log(msg, type="info") {
            const box = document.getElementById('consoleLog');
            box.style.display = 'block';
            const cls = type === 'error' ? 'log-error' : (type === 'success' ? 'log-success' : (type === 'warn' ? 'log-warn' : ''));
            box.innerHTML += `<div class="${cls}">> ${msg}</div>`;
            box.scrollTop = box.scrollHeight;
        }

        function downloadTemplate() {
            const type = document.getElementById('courseType').value;
            if (!type) return alert("Please select a Course Type first.");

            const headers = CONFIG[type].columns;
            const sample = type === 'wafy' 
                ? ["W001", "Fiqh", "20", "20", "80", "80", "100", "100", "Passed", "R"]
                : ["W001", "English", "4", "A", "4.0", "Passed"];

            const wb = XLSX.utils.book_new();
            const ws = XLSX.utils.aoa_to_sheet([headers, sample]);
            XLSX.utils.book_append_sheet(wb, ws, "Template");
            XLSX.writeFile(wb, `${type}_bulk_template.xlsx`);
        }

        function calculateWafyTotalRow(rows) {
            if (rows.some(r => (r.subject||'').toLowerCase() === 'total')) return rows;

            let sumCE = 0, sumCEMax = 0, sumTE = 0, sumTEMax = 0, sumTotal = 0, sumMax = 0;
            let allPassed = true;

            rows.forEach(row => {
                // Helper to parse numbers safely, ignoring '-'
                const getVal = (k) => {
                    const v = row[k];
                    return (v && v !== '-') ? parseFloat(v) : 0;
                };

                sumCE += getVal('ce_mark');
                sumCEMax += getVal('ce_max');
                sumTE += getVal('te_mark');
                sumTEMax += getVal('te_max');
                sumTotal += getVal('total');
                sumMax += getVal('max') || getVal('max_mark');

                const s = (row.status || '').trim().toUpperCase();
                if (s.startsWith('F') || s === 'FAIL') allPassed = false;
            });

            const totalRow = {
                subject: 'Total',
                ce_mark: sumCE.toString(),
                ce_max: sumCEMax.toString(),
                te_mark: sumTE.toString(),
                te_max: sumTEMax.toString(),
                total: sumTotal.toString(),
                max: sumMax.toString(),
                status: allPassed ? 'Passed' : 'Failed',
                exam_mode: '-'
            };

            return [...rows, totalRow];
        }

        // --- CORE PROCESSING ---
        async function processBulkUpload() {
            const type = document.getElementById('courseType').value;
            const semesterKey = document.getElementById('semesterSelect').value;
            const fileInput = document.getElementById('excelFile');

            if (!type || !semesterKey) return alert("Please select Course and Semester.");
            if (!fileInput.files.length) return alert("Please upload a file.");

            document.getElementById('consoleLog').innerHTML = '';
            log("Reading file...");

            const reader = new FileReader();
            reader.onload = async function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, {type: 'array'});
                    const sheet = workbook.Sheets[workbook.SheetNames[0]];
                    
                    // 1. Read with defval: "-" to handle empty cells automatically
                    const rawData = XLSX.utils.sheet_to_json(sheet, { defval: "-" });

                    if (rawData.length === 0) return log("Error: File is empty.", "error");
                    log(`Read ${rawData.length} rows. Grouping by CIC No...`);

                    const groupedData = {};

                    rawData.forEach(row => {
                        const cleanRow = {};
                        let cic = "";

                        Object.keys(row).forEach(header => {
                            const val = String(row[header]).trim();
                            const lowerHeader = header.toLowerCase().replace(/[\s_.]/g, '');
                            
                            if (lowerHeader.includes('cic')) cic = val;

                            const configCols = CONFIG[type].columns;
                            const configKeys = CONFIG[type].keys;
                            
                            const idx = configCols.findIndex(c => c.toLowerCase().replace(/[\s_.]/g, '') === lowerHeader);
                            if (idx > -1) {
                                cleanRow[configKeys[idx]] = val === "" ? "-" : val; // Ensure empty becomes -
                            }
                        });

                        // Ensure all keys exist, default to "-"
                        const configKeys = CONFIG[type].keys;
                        configKeys.forEach(k => {
                            if (k !== 'cic_no' && (cleanRow[k] === undefined || cleanRow[k] === null || cleanRow[k] === "")) {
                                cleanRow[k] = "-";
                            }
                        });

                        if (cic) {
                            if (!groupedData[cic]) groupedData[cic] = [];
                            delete cleanRow.cic_no;
                            groupedData[cic].push(cleanRow);
                        }
                    });

                    const cicList = Object.keys(groupedData);
                    log(`Found ${cicList.length} unique students.`);

                    log("Fetching student IDs from database...");
                    const { data: studentsDB, error: stuError } = await supabase
                        .from('students')
                        .select('id, cic_no')
                        .in('cic_no', cicList);

                    if (stuError) throw stuError;

                    const studentMap = {};
                    studentsDB.forEach(s => studentMap[s.cic_no] = s.id);

                    const upsertPayload = [];
                    const missing = [];

                    for (const cic of cicList) {
                        const uuid = studentMap[cic];
                        if (uuid) {
                            let studentResults = groupedData[cic];

                            if (type === 'wafy') {
                                studentResults = calculateWafyTotalRow(studentResults);
                            }

                            upsertPayload.push({
                                student_id: uuid,
                                semester_key: semesterKey,
                                results_data: studentResults
                            });
                        } else {
                            missing.push(cic);
                        }
                    }

                    if (missing.length > 0) log(`Skipped (Not in DB): ${missing.join(', ')}`, "warn");

                    if (upsertPayload.length > 0) {
                        log(`Uploading ${upsertPayload.length} student records...`);
                        
                        const chunkSize = 50;
                        for (let i = 0; i < upsertPayload.length; i += chunkSize) {
                            const chunk = upsertPayload.slice(i, i + chunkSize);
                            const ids = chunk.map(x => x.student_id);
                            await supabase.from('semester_results').delete().eq('semester_key', semesterKey).in('student_id', ids);

                            const { error } = await supabase.from('semester_results').insert(chunk);
                            if (error) throw error;
                            
                            log(`Batch ${i/chunkSize + 1} uploaded successfully.`, "success");
                        }
                        log("Bulk Upload Complete!", "success");
                        alert("Upload Complete!");
                    } else {
                        log("No valid data to upload.", "error");
                    }

                } catch (err) {
                    log("Error: " + err.message, "error");
                    console.error(err);
                }
            };
            reader.readAsArrayBuffer(fileInput.files[0]);
        }
    </script>
</body>
</html>
