<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>View Books Read - الأبطال</title>
    <link rel="stylesheet" href="sc.css" />
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light fixed-top">
        <a class="navbar-brand" href="index.html"><img src="https://res.cloudinary.com/dh5jui6pu/image/upload/v1751959954/Screenshot_2025-07-08_130148_kg3qdg.png" class="navimg" /></a>
        <button class="navbar-toggler" style="width: 60px;" type="button" data-toggle="collapse" data-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ml-auto">
                <li class="nav-item"><a class="nav-link" href="main.html">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="students-info.html">Students Info</a></li>
                <li class="nav-item active"><a class="nav-link" href="students-progress.html">Students Progress</a></li>
                <li class="nav-item"><a class="nav-link" href="council.html">Our Council</a></li>
            </ul>
        </div>
    </nav>

    <div class="container mt-5" style="margin-top: 100px !important;">
        <div class="row">
            <div class="col-12">
                <h1 class="text-center mb-5" style="font-family: Almarai; color: #02244e;">Books Read</h1>
                <h2 class="text-center mb-5" style="font-family: Almarai; color: #02244e;" id="studentNameTitle">Loading...</h2>
            </div>
        </div>

        <div class="row mb-4">
            <div class="col-12">
                <div class="alert alert-info text-center" role="alert" style="font-family: Almarai;">
                    <i class="fas fa-book"></i>
                    <strong>Total Books: </strong><span id="totalBooks">0</span>
                    &nbsp;&nbsp;|&nbsp;&nbsp;
                    <i class="fas fa-file-alt"></i>
                    <strong>Total Pages: </strong><span id="totalPages">0</span>
                </div>
            </div>
        </div>

        <div class="row mb-4 justify-content-center">
            <div class="col-12 col-md-10">
                <div class="card shadow-sm">
                    <div class="card-body py-3">
                        <form id="filterForm" onsubmit="event.preventDefault(); filterBooks();" class="row align-items-end justify-content-center">
                            <div class="col-md-4 col-sm-12 mb-2 mb-md-0">
                                <label for="startDate" class="font-weight-bold text-muted small">From Date</label>
                                <input type="date" id="startDate" class="form-control">
                            </div>
                            <div class="col-md-4 col-sm-12 mb-2 mb-md-0">
                                <label for="endDate" class="font-weight-bold text-muted small">To Date</label>
                                <input type="date" id="endDate" class="form-control">
                            </div>
                            <div class="col-md-4 col-sm-12">
                                <div class="btn-group w-100" role="group">
                                    <button type="button" onclick="filterBooks()" class="btn btn-primary">
                                        <i class="fas fa-filter"></i> Filter
                                    </button>
                                    <button type="button" onclick="clearFilter()" class="btn btn-outline-secondary">
                                        <i class="fas fa-undo"></i> Clear
                                    </button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <div class="row mb-3">
            <div class="col-12">
                <div class="card students-card">
                    <div class="card-body">
                        <div class="row align-items-center">
                            <div class="col-1 text-center"><h5 style="font-family: Almarai; color: #02244e; margin:0; font-weight: bold;">#</h5></div>
                            <div class="col-3 text-center"><h5 style="font-family: Almarai; color: #02244e; margin:0; font-weight: bold;">Book Name</h5></div>
                            <div class="col-3 text-center"><h5 style="font-family: Almarai; color: #02244e; margin:0; font-weight: bold;">Poet</h5></div>
                            <div class="col-2 text-center"><h5 style="font-family: Almarai; color: #02244e; margin:0; font-weight: bold;">Pages</h5></div>
                            <div class="col-3 text-center"><h5 style="font-family: Almarai; color: #02244e; margin:0; font-weight: bold;">Date</h5></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row" id="booksList">
            </div>

        <div class="row" id="noBooksMessage" style="display: none;">
            <div class="col-12 text-center">
                <div class="card students-card">
                    <div class="card-body">
                        <i class="fas fa-book-open" style="font-size: 4rem; color: #6c757d; margin-bottom: 1rem;"></i>
                        <h3 class="text-muted">No books found</h3>
                    </div>
                </div>
            </div>
        </div>

        <div class="row mt-4">
            <div class="col-12 text-center">
                <a href="#" class="btn btn-secondary btn-lg" id="backBtn" style="font-family: Almarai;">
                    <i class="fas fa-arrow-left"></i> Back
                </a>
            </div>
        </div>
    </div>

    <script>

        // Store all books globally to support filtering
        let allBooks = [];

        function getQueryParam(key) {
            return new URLSearchParams(window.location.search).get(key);
        }

        async function loadPage() {
            const cicNo = getQueryParam('cicNo');
            if (!cicNo) {
                document.getElementById('studentNameTitle').textContent = "Error: Missing Student ID";
                return;
            }

            // 1. Get Student Details
            const { data: student, error } = await supabase
                .from('students')
                .select('id, full_name, cic_no')
                .eq('cic_no', cicNo)
                .single();

            if (error || !student) {
                document.getElementById('studentNameTitle').textContent = "Student Not Found";
                return;
            }

            // Update UI
            document.getElementById('studentNameTitle').textContent = `${student.full_name} (${student.cic_no})`;
            document.getElementById('backBtn').href = `view-student-progress.html?cicNo=${student.cic_no}`;

            // 2. Get Books (Added 'date' column)
            const { data: books, error: bookError } = await supabase
                .from('books')
                .select('id, name, poet, pages, date')
                .eq('student_id', student.id)
                .order('date', { ascending: false }); // Most recent first

            if (bookError) {
                alert("Error loading books: " + bookError.message);
                return;
            }

            // Save to global variable
            allBooks = books || [];
            
            // Render all books initially
            renderBooks(allBooks);
        }

        function filterBooks() {
            const startDateStr = document.getElementById('startDate').value;
            const endDateStr = document.getElementById('endDate').value;

            if (!startDateStr && !endDateStr) {
                return; // Do nothing if fields are empty
            }

            const filtered = allBooks.filter(book => {
                if (!book.date) return false; // If book has no date, exclude it when filtering by date
                
                // Compare strings directly (YYYY-MM-DD works well for comparison)
                if (startDateStr && book.date < startDateStr) return false;
                if (endDateStr && book.date > endDateStr) return false;
                
                return true;
            });

            renderBooks(filtered);
        }

        function clearFilter() {
            // Reset inputs
            document.getElementById('startDate').value = '';
            document.getElementById('endDate').value = '';
            // Show all books
            renderBooks(allBooks);
        }

        function renderBooks(books) {
            const list = document.getElementById('booksList');
            const totalBooks = document.getElementById('totalBooks');
            const totalPages = document.getElementById('totalPages');
            
            // Calculate Stats for the current (filtered) list
            totalBooks.textContent = books.length;
            const pageSum = books.reduce((sum, book) => sum + (book.pages || 0), 0);
            totalPages.textContent = pageSum;

            if (books.length === 0) {
                list.innerHTML = '';
                document.getElementById('noBooksMessage').style.display = 'block';
                return;
            }

            document.getElementById('noBooksMessage').style.display = 'none';
            list.innerHTML = '';

            books.forEach((book, index) => {
                // Format Date nicely if present
                let dateDisplay = '-';
                if (book.date) {
                    dateDisplay = book.date; // Keeping standard format
                }

                list.innerHTML += `
                <div class="col-12 mb-3">
                    <div class="card students-card">
                        <div class="card-body">
                            <div class="row align-items-center">
                                <div class="col-1 text-center"><h5>${index + 1}</h5></div>
                                <div class="col-3 text-center"><h5>${book.name}</h5></div>
                                <div class="col-3 text-center"><h5>${book.poet}</h5></div>
                                <div class="col-2 text-center"><h5>${book.pages}</h5></div>
                                <div class="col-3 text-center"><h6 class="text-muted">${dateDisplay}</h6></div>
                            </div>
                        </div>
                    </div>
                </div>`;
            });
        }

        document.addEventListener('DOMContentLoaded', loadPage);
    </script>
</body>
</html>
