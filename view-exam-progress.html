<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Exam Progress</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        body {
            background: #f9f9f9;
        }
        h1, h2, h3 {
            color: #02244e;
            font-family: Almarai, Arial, sans-serif;
        }
        .section-bar {
            background: #dde4f3;
            border-radius: 14px;
            font-size: 2.1rem;
            font-weight: 700;
            padding: 27px 18px 18px 18px;
            margin: 48px 0 24px 0;
            text-align: center;
            color: #02244e;
            box-shadow: 0 3px 12px rgba(41,94,148,0.11);
            letter-spacing: 1px;
            cursor: pointer;
        }
        .group-bar {
            background: #f1f5fb;
            border-radius: 9px;
            font-size: 1.5rem;
            font-weight: 600;
            padding: 12px 10px 8px 10px;
            margin: 22px 0 14px 0;
            color: #1d3d6d;
            letter-spacing: .5px;
            cursor: pointer;
        }
        .option-btn {
            margin: 0 8px 12px 8px;
            font-size: 1.15rem;
            font-weight: 500;
            min-width: 140px;
        }
        .result-card {
            border-radius: 12px;
            background: #fff;
            box-shadow: 0 2px 12px rgba(41,94,148,0.08);
            padding: 20px;
            margin-bottom: 24px;
            max-width: 720px;
            margin-left: auto;
            margin-right: auto;
        }
        .result-card h4 {
            color: #333;
            margin-bottom: 16px;
        }
        .back-nav {
            font-size: 1rem;
            margin-bottom: 2rem;
            margin-top: 26px;
        }
        .fade-in {
            animation: fadeIn 0.3s;
        }
        @keyframes fadeIn {
            from { opacity: 0;}
            to {opacity: 1;}
        }
    </style>
</head>
<body>
<div class="container" style="margin-top: 90px; max-width: 900px;">
    <h1 class="text-center mb-4">View Exam Progress</h1>
    <h2 id="studentNameTitle" class="text-center mb-5"></h2>
    <div id="navContainer"></div>
    <div id="resultsContainer"></div>
    <div id="noResultsMessage" class="text-center" style="display:none;"></div>
    <div class="mt-5 text-center">
        <a href="javascript:history.back()" class="btn btn-secondary btn-lg">Back</a>
    </div>
</div>
<script>
    function getQueryParam(key) {
        const params = new URLSearchParams(window.location.search);
        return params.get(key);
    }

    const cicNo = getQueryParam('cicNo');
    const students = JSON.parse(localStorage.getItem('students')) || [];
    const student = students.find(s => s.cicNo === cicNo);
    if(student) {
        document.getElementById('studentNameTitle').innerText = `Results for ${student.name} (${student.cicNo})`;
    }

    const navContainer = document.getElementById('navContainer');
    const resultsContainer = document.getElementById('resultsContainer');
    const noResultsMessage = document.getElementById('noResultsMessage');

    // Structure
    const resultSections = [
        {
            section: 'Wafy Results',
            groups: [
                {
                    group: 'Thamheediyya',
                    keys: [
                        { keyPrefix: 'examResult_wafy_thamheediyya_sem1', label: 'Sem 1' },
                        { keyPrefix: 'examResult_wafy_thamheediyya_sem2', label: 'Sem 2' },
                        { keyPrefix: 'examResult_wafy_thamheediyya_sem3', label: 'Sem 3' },
                        { keyPrefix: 'examResult_wafy_thamheediyya_sem4', label: 'Sem 4' },
                    ]
                },
                {
                    group: 'Aliya',
                    keys: [
                        { keyPrefix: 'examResult_wafy_aliya_sem1', label: 'Sem 1' },
                        { keyPrefix: 'examResult_wafy_aliya_sem2', label: 'Sem 2' },
                        { keyPrefix: 'examResult_wafy_aliya_sem3', label: 'Sem 3' },
                        { keyPrefix: 'examResult_wafy_aliya_sem4', label: 'Sem 4' },
                        { keyPrefix: 'examResult_wafy_aliya_sem5', label: 'Sem 5' },
                        { keyPrefix: 'examResult_wafy_aliya_sem6', label: 'Sem 6' }
                    ]
                }
            ]
        },
        {
            section: 'Higher Secondary & UG Results',
            groups: [
                {
                    group: 'Higher Secondary',
                    keys: [
                        { keyPrefix: 'examResult_highersec_plus1', label: 'Plus One' },
                        { keyPrefix: 'examResult_highersec_plus2', label: 'Plus Two' }
                    ]
                },
                {
                    group: 'Degree',
                    keys: [
                        { keyPrefix: 'examResult_degree_sem1', label: 'Sem 1' },
                        { keyPrefix: 'examResult_degree_sem2', label: 'Sem 2' },
                        { keyPrefix: 'examResult_degree_sem3', label: 'Sem 3' },
                        { keyPrefix: 'examResult_degree_sem4', label: 'Sem 4' },
                        { keyPrefix: 'examResult_degree_sem5', label: 'Sem 5' },
                        { keyPrefix: 'examResult_degree_sem6', label: 'Sem 6' }
                    ]
                }
            ]
        }
    ];

    // Drilldown Navigation State
    let navState = { section: null, group: null, sem: null };

    function renderMainSections() {
        navContainer.innerHTML = '';
        resultsContainer.innerHTML = '';
        noResultsMessage.innerHTML = '';
        navState = { section: null, group: null, sem: null };
        resultSections.forEach((sectionObj, secIdx) => {
            const sectionDiv = document.createElement('div');
            sectionDiv.className = 'section-bar fade-in';
            sectionDiv.textContent = sectionObj.section;
            sectionDiv.onclick = () => renderGroups(secIdx);
            navContainer.appendChild(sectionDiv);
        });
    }

    function renderGroups(secIdx) {
        navContainer.innerHTML = '';
        resultsContainer.innerHTML = '';
        noResultsMessage.innerHTML = '';
        navState.section = secIdx;
        const sectionObj = resultSections[secIdx];
        sectionObj.groups.forEach((groupObj, grpIdx) => {
            const groupDiv = document.createElement('div');
            groupDiv.className = 'group-bar fade-in';
            groupDiv.textContent = groupObj.group;
            groupDiv.onclick = () => renderSemOptions(secIdx, grpIdx);
            navContainer.appendChild(groupDiv);
        });
        navContainer.insertAdjacentHTML('afterbegin', `<div class='back-nav'><a href='#' onclick='renderMainSections();return false;'>&larr; All Sections</a></div>`);
    }

    function renderSemOptions(secIdx, grpIdx) {
        navContainer.innerHTML = '';
        resultsContainer.innerHTML = '';
        noResultsMessage.innerHTML = '';
        navState.group = grpIdx;
        const sectionObj = resultSections[secIdx];
        const groupObj = sectionObj.groups[grpIdx];
        navContainer.insertAdjacentHTML('afterbegin', `<div class='back-nav'><a href='#' onclick='renderGroups(${secIdx});return false;'>&larr; ${sectionObj.section}</a></div>`);
        const labelDiv = document.createElement('div');
        labelDiv.style.fontWeight = 'bold';
        labelDiv.style.marginBottom = '16px';
        labelDiv.style.marginTop = '0px';
        labelDiv.textContent = groupObj.group;
        navContainer.appendChild(labelDiv);
        groupObj.keys.forEach((semObj, semIdx) => {
            const btn = document.createElement('button');
            btn.className = 'btn btn-primary option-btn';
            btn.textContent = semObj.label;
            btn.onclick = () => renderResultTable(secIdx, grpIdx, semIdx);
            navContainer.appendChild(btn);
        });
    }

    function renderResultTable(secIdx, grpIdx, semIdx) {
        resultsContainer.innerHTML = '';
        noResultsMessage.innerHTML = '';
        const sectionObj = resultSections[secIdx];
        const groupObj = sectionObj.groups[grpIdx];
        const semObj = groupObj.keys[semIdx];
        const resultKey = `${semObj.keyPrefix}_${cicNo}`;
        const jsonData = localStorage.getItem(resultKey);
        navContainer.innerHTML = '';
        navContainer.insertAdjacentHTML('afterbegin', `<div class='back-nav'><a href='#' onclick='renderSemOptions(${secIdx},${grpIdx});return false;'>&larr; ${groupObj.group}</a></div>`);
        const header = document.createElement('h4');
        header.textContent = `${semObj.label}`;
        header.style.textAlign = 'center';
        header.style.marginTop = '12px';
        header.style.marginBottom = '18px';
        resultsContainer.appendChild(header);
        if (jsonData) {
            const resultData = JSON.parse(jsonData);
            const resultElement = document.createElement('div');
            resultElement.className = 'result-card fade-in';
            resultElement.innerHTML = `${createTableFromJSON(resultData)}`;
            resultsContainer.appendChild(resultElement);
        } else {
            resultsContainer.innerHTML += "<div class='alert alert-warning text-center mt-2'>No result uploaded for this semester.</div>";
        }
    }

    function createTableFromJSON(json) {
        let table = '<div class="table-responsive"><table class="table table-bordered table-sm"><tbody>';
        for (const row of json) {
            table += '<tr>' + row.map(cell => `<td>${cell}</td>`).join('') + '</tr>';
        }
        table += '</tbody></table></div>';
        return table;
    }

    // Start with main sections on page load
    renderMainSections();
</script>
</body>
</html>
