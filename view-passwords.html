<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Manage Passwords</title>
    <link rel="stylesheet" href="sc.css" />
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <script>
        const role = localStorage.getItem('mgmtUserRole');
        if (role !== 'chief_admin') {
            alert('Access Restricted: Chief Admin Only');
            window.location.href = 'rk-login.html';
        }
    </script>

    <nav class="navbar navbar-expand-lg navbar-light bg-light fixed-top">
        <a class="navbar-brand" href="index.html"><img src="https://res.cloudinary.com/dh5jui6pu/image/upload/v1751959954/Screenshot_2025-07-08_130148_kg3qdg.png" class="navimg" /></a>
    </nav>

    <div class="container" style="margin-top:120px;">
        <div class="row">
            <div class="col-12">
                <h3 class="mb-4 text-center">Manage User Passwords</h3>
                
                <div class="card students-card mb-4">
                    <div class="card-header bg-dark text-white">
                        <h5 class="mb-0">Officials</h5>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-striped">
                                <thead><tr><th>Username</th><th>Role</th><th>Action</th></tr></thead>
                                <tbody id="officialsTable"><tr><td colspan="3">Loading...</td></tr></tbody>
                            </table>
                        </div>
                    </div>
                </div>
                
                <div class="card students-card">
                    <div class="card-header bg-primary text-white">
                        <h5 class="mb-0">Students</h5>
                    </div>
                    <div class="card-body">
                        <input type="text" id="studentSearch" class="form-control mb-3" placeholder="Search students..." onkeyup="filterStudents()">
                        
                        <div class="table-responsive">
                            <table class="table table-striped">
                                <thead><tr><th>CIC No.</th><th>Name</th><th>Action</th></tr></thead>
                                <tbody id="studentsTable"><tr><td colspan="3">Loading...</td></tr></tbody>
                            </table>
                        </div>
                    </div>
                </div>
                
                <a href="chief-admin-main.html" class="btn btn-secondary btn-block mt-3">Back</a>
            </div>
        </div>
    </div>

    <script>
        const supabaseUrl = 'https://ewpmkjqcjnhtxyfqgiba.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV3cG1ranFjam5odHh5ZnFnaWJhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjIzMTUyOTMsImV4cCI6MjA3Nzg5MTI5M30.i1ivEtua8fCktdit_DASxQigFg2Kb8NLn0WLLQ3LFmI';
        const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

        let allStudents = [];

        async function loadData() {
            // 1. Load Officials
            // We fetch 'id' so we can reset the password for that specific user UUID
            const { data: officials, error: offError } = await supabase
                .from('officials')
                .select('id, username, role')
                .order('role');
            
            const offBody = document.getElementById('officialsTable');
            if(offError) {
                offBody.innerHTML = `<tr><td colspan="3" class="text-danger">${offError.message}</td></tr>`;
            } else {
                let html = '';
                officials.forEach(o => {
                    html += `<tr>
                        <td><strong>${o.username}</strong></td>
                        <td><span class="badge badge-info">${o.role}</span></td>
                        <td>
                            <button class="btn btn-sm btn-danger" onclick="resetPassword('${o.id}', '${o.username}')">
                                Reset Password
                            </button>
                        </td>
                    </tr>`;
                });
                offBody.innerHTML = html || '<tr><td colspan="3">No officials found.</td></tr>';
            }

            // 2. Load Students
            const { data: students, error: stuError } = await supabase
                .from('students')
                .select('id, cic_no, full_name')
                .order('cic_no');
            
            if(stuError) {
                document.getElementById('studentsTable').innerHTML = `<tr><td colspan="3" class="text-danger">${stuError.message}</td></tr>`;
            } else {
                allStudents = students || [];
                renderStudents(allStudents);
            }
        }

        function renderStudents(list) {
            const tbody = document.getElementById('studentsTable');
            if(list.length === 0) {
                tbody.innerHTML = '<tr><td colspan="3">No students found.</td></tr>';
                return;
            }
            let html = '';
            list.forEach(s => {
                html += `<tr>
                    <td>${s.cic_no}</td>
                    <td>${s.full_name}</td>
                    <td>
                        <button class="btn btn-sm btn-warning" onclick="resetPassword('${s.id}', '${s.full_name}')">
                            Reset Password
                        </button>
                    </td>
                </tr>`;
            });
            tbody.innerHTML = html;
        }

        function filterStudents() {
            const term = document.getElementById('studentSearch').value.toLowerCase();
            const filtered = allStudents.filter(s => 
                s.cic_no.toLowerCase().includes(term) || 
                s.full_name.toLowerCase().includes(term)
            );
            renderStudents(filtered);
        }

        // --- THE MAGIC RESET FUNCTION ---
        window.resetPassword = async function(userId, name) {
            const newPass = prompt(`Enter NEW password for ${name}:`);
            if(!newPass) return; // Cancelled
            
            if(newPass.length < 6) {
                alert("Password must be at least 6 characters.");
                return;
            }

            // Call the SQL function we created in Step 1
            const { error } = await supabase.rpc('reset_user_password', {
                target_user_id: userId, 
                new_password: newPass
            });

            if(error) {
                console.error(error);
                alert("Error: " + error.message);
            } else {
                alert(`Success! Password for ${name} has been changed.`);
            }
        };

        loadData();
    </script>
</body>
</html>
