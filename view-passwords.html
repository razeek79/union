<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Manage Passwords</title>
    <link rel="stylesheet" href="sc.css" />
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
</head>
<body>
    <script>
        const role = localStorage.getItem('mgmtUserRole');
        if (role !== 'chief_admin') {
            alert('Access Restricted: Chief Admin Only');
            window.location.href = 'rk-login.html';
        }
    </script>

    <nav class="navbar navbar-expand-lg navbar-light bg-light fixed-top">
        <a class="navbar-brand" href="index.html"><img src="https://res.cloudinary.com/dh5jui6pu/image/upload/v1751959954/Screenshot_2025-07-08_130148_kg3qdg.png" class="navimg" /></a>
    </nav>

    <div class="container" style="margin-top:120px;">
        <div class="row">
            <div class="col-12">
                <h3 class="mb-4 text-center">Manage User Passwords</h3>
                
                <div class="card students-card mb-4">
                    <div class="card-header bg-dark text-white">
                        <h5 class="mb-0">Officials</h5>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-striped">
                                <thead><tr><th>Username</th><th>Role</th><th>Action</th></tr></thead>
                                <tbody id="officialsTable"><tr><td colspan="3">Loading...</td></tr></tbody>
                            </table>
                        </div>
                    </div>
                </div>
                
                <div class="card students-card">
                    <div class="card-header bg-primary text-white">
                        <h5 class="mb-0">Students</h5>
                    </div>
                    <div class="card-body">
                        <div class="d-flex mb-3">
                            <input type="text" id="studentSearch" class="form-control mr-2" placeholder="Search students..." onkeyup="filterStudents()">
                            <button class="btn btn-success" style="white-space: nowrap;" onclick="shareCredentialsBlank()">
                                Share (Blank Pass) <i class="fab fa-whatsapp"></i>
                            </button>
                        </div>
                        <small class="text-muted d-block mb-3">*Use the "Reset Password" button below to share credentials with the password automatically filled in.</small>
                        
                        <div class="table-responsive">
                            <table class="table table-striped">
                                <thead><tr><th>CIC No.</th><th>Name</th><th>Phone</th><th>Action</th></tr></thead>
                                <tbody id="studentsTable"><tr><td colspan="4">Loading...</td></tr></tbody>
                            </table>
                        </div>
                    </div>
                </div>
                
                <a href="chief-admin-main.html" class="btn btn-secondary btn-block mt-3">Back</a>
            </div>
        </div>
    </div>

    <script>
        const supabaseClient = window.supabaseClient;

        // *** SECRET SUFFIX for 4-char passwords ***
        const PASSWORD_SUFFIX = "_ALABTHAL";

        let allStudents = [];
        let displayedStudents = [];

        async function loadData() {
            // 1. Load Officials
            const { data: officials, error: offError } = await supabaseClient
                .from('officials')
                .select('id, username, role')
                .order('role');
            
            const offBody = document.getElementById('officialsTable');
            if(offError) {
                offBody.innerHTML = `<tr><td colspan="3" class="text-danger">${offError.message}</td></tr>`;
            } else {
                let html = '';
                officials.forEach(o => {
                    html += `<tr>
                        <td><strong>${o.username}</strong></td>
                        <td><span class="badge badge-info">${o.role}</span></td>
                        <td>
                            <button class="btn btn-sm btn-danger" onclick="resetOfficialPassword('${o.id}', '${o.username}')">
                                Reset Password
                            </button>
                        </td>
                    </tr>`;
                });
                offBody.innerHTML = html || '<tr><td colspan="3">No officials found.</td></tr>';
            }

            // 2. Load Students
            const { data: students, error: stuError } = await supabaseClient
                .from('students')
                .select('id, cic_no, full_name, phone_no')
                .order('cic_no');
            
            if(stuError) {
                document.getElementById('studentsTable').innerHTML = `<tr><td colspan="4" class="text-danger">${stuError.message}</td></tr>`;
            } else {
                allStudents = students || [];
                renderStudents(allStudents);
            }
        }

        function renderStudents(list) {
            displayedStudents = list;
            const tbody = document.getElementById('studentsTable');
            if(list.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4">No students found.</td></tr>';
                return;
            }
            let html = '';
            list.forEach(s => {
                // Prepare phone number safely for function argument
                const phoneArg = s.phone_no ? s.phone_no.trim() : '';
                const phoneDisplay = s.phone_no ? s.phone_no : '<span class="text-muted">-</span>';
                
                html += `<tr>
                    <td>${s.cic_no}</td>
                    <td>${s.full_name}</td>
                    <td>${phoneDisplay}</td>
                    <td>
                        <button class="btn btn-sm btn-warning" onclick="resetStudentPassword('${s.id}', '${s.full_name}', '${phoneArg}')">
                            Reset & Share
                        </button>
                    </td>
                </tr>`;
            });
            tbody.innerHTML = html;
        }

        function filterStudents() {
            const term = document.getElementById('studentSearch').value.toLowerCase();
            const filtered = allStudents.filter(s => 
                s.cic_no.toLowerCase().includes(term) || 
                s.full_name.toLowerCase().includes(term)
            );
            renderStudents(filtered);
        }

        // --- GENERAL SHARE (BLANK PASSWORD) ---
        // Used when you just want to send the link but don't want to change the password
        function shareCredentialsBlank() {
            const validTargets = displayedStudents.filter(s => s.phone_no && s.phone_no.trim() !== "");

            if (validTargets.length === 0) return alert("No students with phone numbers visible.");
            if (validTargets.length > 1) return alert("Please filter to a single student to share.");

            const student = validTargets[0];
            generateWhatsAppLink(student.phone_no, "________"); // Blank password
        }

        // --- HELPER: Generate and Open WhatsApp Link ---
        function generateWhatsAppLink(phone, passwordDisplay) {
            if(!phone) {
                alert("This student does not have a phone number registered.");
                return;
            }

            const message = `*Dear Student*,
This is to inform you that your login credentials have been generated.

Please use your CIC Number as the User ID and the password given below to log in.
*Password:* ${passwordDisplay}

For security reasons, do not share your login credentials with anyone.

*Regards,*
*AL ABTHAL*`;

            const encodedMessage = encodeURIComponent(message);
            window.open(`https://wa.me/${phone}?text=${encodedMessage}`, '_blank');
        }

        // --- RESET FUNCTION FOR STUDENTS (Reset + Auto Share) ---
        window.resetStudentPassword = async function(userId, name, phone) {
            const newPass = prompt(`Enter NEW password for Student ${name}:`);
            if(!newPass) return; 
            
            if(newPass.length < 4) {
                alert("Password must be at least 4 characters.");
                return;
            }

            const finalPass = newPass + PASSWORD_SUFFIX;

            const { error } = await supabaseClient.rpc('reset_user_password', {
                target_user_id: userId, 
                new_password: finalPass
            });

            if(error) {
                console.error(error);
                alert("Error: " + error.message);
            } else {
                // SUCCESS: Now ask to share the KNOWN new password
                if(phone && confirm(`Password reset successful for ${name}.\n\nDo you want to share the NEW credentials on WhatsApp?`)) {
                    generateWhatsAppLink(phone, newPass);
                } else if (!phone) {
                    alert(`Password reset successful.\n(Cannot share: No phone number registered for ${name})`);
                } else {
                    alert("Password reset successful.");
                }
            }
        };

        // --- RESET FUNCTION FOR OFFICIALS (Standard) ---
        window.resetOfficialPassword = async function(userId, name) {
            const newPass = prompt(`Enter NEW password for Official ${name}:`);
            if(!newPass) return; 
            
            if(newPass.length < 6) {
                alert("Official passwords must be at least 6 characters.");
                return;
            }

            const { error } = await supabaseClient.rpc('reset_user_password', {
                target_user_id: userId, 
                new_password: newPass
            });

            if(error) {
                console.error(error);
                alert("Error: " + error.message);
            } else {
                alert(`Success! Password for ${name} changed.`);
            }
        };

        loadData();
    </script>
</body>
</html>
