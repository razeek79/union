<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Update Wafy Results</title>
  <link rel="stylesheet" href="sc.css">
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
  <style>
      .editable-cell { cursor: pointer; background: #fff; }
      .editable-cell:hover { background-color: #f1f7ff; outline: 1px solid #007bff; }
      .editable-cell:focus { outline: 2px solid #007bff; background-color: #fff; }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-light bg-light fixed-top">
      <a class="navbar-brand" href="index.html"><img src="https://res.cloudinary.com/dh5jui6pu/image/upload/v1751959954/Screenshot_2025-07-08_130148_kg3qdg.png" class="navimg" /></a>
  </nav>

  <div class="container" style="margin-top: 100px; max-width: 1200px;">
    <div class="card students-card">
      <div class="card-body">
        <h3 class="text-center mb-4" style="color: #02244e; font-family: Almarai;">Update Wafy Results</h3>
        <h5 id="studentNameDisplay" class="text-center text-muted mb-4">Loading...</h5>

        <div class="d-flex justify-content-between align-items-center mb-3">
            <div>
                <input type="file" id="fileInput" accept=".xlsx,.xls,.csv" style="display:none" onchange="handleFileUpload(event)">
                <button class="btn btn-success" onclick="document.getElementById('fileInput').click()"><i class="fas fa-file-excel"></i> Import Excel</button>
            </div>
            <div>
                <button class="btn btn-primary" onclick="saveTableData()"><i class="fas fa-save"></i> Save</button>
                <button class="btn btn-danger ml-2" onclick="deleteResults()"><i class="fas fa-trash"></i> Clear</button>
            </div>
        </div>

        <div class="alert alert-info p-2 text-center">
            <small><strong>Columns:</strong> Subject | Ce Mark | Ce Max | Te Mark | Te Max | Total | Max | Status | Exam Mode</small>
        </div>

        <div id="previewSection" style="display:none;">
            <div class="table-responsive">
                <table class="table table-bordered table-striped text-center" id="resultsTable">
                    <thead class="thead-dark">
                        <tr>
                            <th>Subject</th>
                            <th>CE Mark</th><th>CE Max</th>
                            <th>TE Mark</th><th>TE Max</th>
                            <th>Total</th><th>Max</th>
                            <th>Status</th><th>Exam Mode</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
                <button class="btn btn-outline-secondary btn-sm mb-3" onclick="addNewRow()">+ Add Row</button>
            </div>
        </div>
        <div id="noDataMsg" class="text-center text-muted mt-5" style="display:none;">No results found.</div>
      </div>
    </div>
    <div class="text-center mt-3"><a href="update-exam-progress-wafy.html" class="btn btn-secondary">Back</a></div>
  </div>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

  <script>
    const supabaseClient = window.supabaseClient;
    // --- CONFIG FOR WAFY ---
    const SEMESTER_KEY = 'wafy_thamheediyya_sem4'; // <--- CHANGE THIS FOR OTHER SEMESTERS
    const TABLE_KEYS = ["subject", "ce_mark", "ce_max", "te_mark", "te_max", "total", "max", "status", "exam_mode"];
    
    // --- SUPABASE ---
    let currentStudentId = null;

    async function init() {
        // Safer Auth Check
        const role = localStorage.getItem('mgmtUserRole');
        if (!role) {
            document.body.innerHTML = '<div class="container mt-5 alert alert-danger text-center">Access Denied. Please <a href="index.html">Log In</a>.</div>';
            return;
        }

        const cicNo = new URLSearchParams(window.location.search).get('cicNo');
        if (!cicNo) return alert("Missing CIC No.");
        
        const { data: student, error } = await supabaseClient.from('students').select('id, full_name, cic_no').eq('cic_no', cicNo).single();
        if (error || !student) return alert("Student Not Found");
        
        currentStudentId = student.id;
        document.getElementById('studentNameDisplay').textContent = `${student.full_name} (${student.cic_no})`;
        loadExistingResults();
    }

    async function loadExistingResults() {
        const { data } = await supabaseClient.from('semester_results').select('results_data').match({ student_id: currentStudentId, semester_key: SEMESTER_KEY }).single();
        if (data?.results_data?.length > 0) renderTable(data.results_data);
        else { document.getElementById('noDataMsg').style.display = 'block'; document.getElementById('previewSection').style.display = 'none'; }
    }

    function renderTable(data) {
        document.getElementById('tableBody').innerHTML = '';
        data.forEach(row => addRowToTable(row));
        document.getElementById('previewSection').style.display = 'block';
        document.getElementById('noDataMsg').style.display = 'none';
    }

    function addRowToTable(rowData = {}) {
        const tr = document.createElement('tr');
        TABLE_KEYS.forEach(key => {
            const td = document.createElement('td');
            td.contentEditable = true; td.className = 'editable-cell';
            // Helper to find key even if casing/spaces differ
            const val = rowData[key] || rowData[key.replace(/_/g, ' ')] || rowData[key.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase())] || '';
            td.textContent = val; td.dataset.key = key;
            tr.appendChild(td);
        });
        const actionTd = document.createElement('td');
        actionTd.innerHTML = `<button class="btn btn-sm btn-danger" onclick="this.closest('tr').remove()"><i class="fas fa-times"></i></button>`;
        tr.appendChild(actionTd);
        document.getElementById('tableBody').appendChild(tr);
    }
    function addNewRow() { addRowToTable({}); }

    function handleFileUpload(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(evt) {
            const wb = XLSX.read(evt.target.result, {type: 'binary'});
            const jsonData = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
            if(confirm("Replace current data?")) renderTable(jsonData);
        };
        reader.readAsBinaryString(file);
    }

    async function saveTableData() {
        if (!currentStudentId) return;
        const rows = document.querySelectorAll('#tableBody tr');
        const dataToSave = [];
        rows.forEach(tr => {
            const rowObj = {}; let hasData = false;
            tr.querySelectorAll('td.editable-cell').forEach(td => {
                rowObj[td.dataset.key] = td.textContent.trim();
                if(td.textContent.trim()) hasData = true;
            });
            if (hasData) dataToSave.push(rowObj);
        });

        await supabaseClient.from('semester_results').delete().match({ student_id: currentStudentId, semester_key: SEMESTER_KEY });
        const { error } = await supabaseClient.from('semester_results').insert([{ student_id: currentStudentId, semester_key: SEMESTER_KEY, results_data: dataToSave }]);
        if (error) alert(error.message); else alert("Saved!");
    }

    async function deleteResults() {
        if(!confirm("Delete all?")) return;
        await supabaseClient.from('semester_results').delete().match({ student_id: currentStudentId, semester_key: SEMESTER_KEY });
        location.reload();
    }
    window.onload = init;
  </script>
</body>
</html>
