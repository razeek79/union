<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Update Higher Secondary Plus One Results</title>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
  <style>
      .big-bar {
        border-radius: 16px;
        background: #f5f7fa;
        box-shadow: 0 2px 12px rgba(41,94,148,0.12);
        padding: 32px 20px;
        font-size: 2rem;
        color: #02244e;
        text-align: center;
        margin-bottom: 36px;
        font-family: Almarai, Arial, sans-serif;
      }
      .action-buttons {
        margin-bottom: 30px;
      }
      .upload-btn {
        font-size: 1.1rem;
        margin-bottom: 14px;
      }
  </style>
</head>
<body>
  <div class="container" style="margin-top: 90px; max-width: 800px;">
    <div class="big-bar mb-4">Higher Secondary - Plus One</div>
    <div class="action-buttons text-center">
      <button class="btn btn-success upload-btn" onclick="document.getElementById('fileInput').click()">Import from Excel</button>
      <input type="file" id="fileInput" accept=".xlsx,.xls,.csv" style="display:none" onchange="handleFileUpload(event)">
      <button class="btn btn-primary ml-3" id="saveButton" onclick="saveResult()" style="display:none;">Save</button>
      <button class="btn btn-danger ml-3" onclick="removeResult()">Remove Results</button>
    </div>
    <div id="resultPreview" class="mb-4"></div>
    <div class="mt-5 text-center">
      <a href="update-exam-progress-highersec.html" class="btn btn-secondary btn-lg">Back</a>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
  <script>
    let excelDataJson = null;

    function getQueryParam(key) {
        const params = new URLSearchParams(window.location.search);
        return params.get(key);
    }

    const cicNo = getQueryParam('cicNo');
    const resultKey = `examResult_highersec_plus1_${cicNo}`;

    function handleFileUpload(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(evt) {
        const data = evt.target.result;
        const workbook = XLSX.read(data, {type: 'binary'});
        const sheetName = workbook.SheetNames[0];
        const sheet = workbook.Sheets[sheetName];
        excelDataJson = XLSX.utils.sheet_to_json(sheet, {header:1});
        showResults(excelDataJson);
        document.getElementById('saveButton').style.display = 'inline-block';
      };
      reader.readAsBinaryString(file);
    }

    function showResults(json) {
      let html = '<h5>Extracted Results:</h5><div class="table-responsive"><table class="table table-bordered table-sm"><tbody>';
      for (const row of json) {
        html += '<tr>' + row.map(cell => `<td>${cell}</td>`).join('') + '</tr>';
      }
      html += '</tbody></table></div>';
      document.getElementById('resultPreview').innerHTML = html;
    }

    function saveResult() {
        if (excelDataJson && cicNo) {
            localStorage.setItem(resultKey, JSON.stringify(excelDataJson));
            alert('Result saved successfully!');
        } else {
            alert('No Excel data to save or student not specified.');
        }
    }

    function removeResult() {
      if(confirm('Are you sure you want to remove the current result?')) {
        localStorage.removeItem(resultKey);
        document.getElementById('resultPreview').innerHTML = '';
        document.getElementById('saveButton').style.display = 'none';
        document.getElementById('fileInput').value = '';
        excelDataJson = null;
        alert('Result removed.');
      }
    }

    function loadInitialState() {
        const savedData = localStorage.getItem(resultKey);
        if (savedData) {
            excelDataJson = JSON.parse(savedData);
            showResults(excelDataJson);
        }
    }

    window.onload = loadInitialState;
  </script>
    <script src="exam-access.js"></script>
    <script src="exam-access-guard.js"></script>
</body>
</html>
