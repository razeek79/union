<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Official Credentials - الأبطال</title>
    <link rel="stylesheet" href="sc.css" />
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <!-- Supabase Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light fixed-top">
        <a class="navbar-brand" href="index.html"><img src="https://res.cloudinary.com/dh5jui6pu/image/upload/v1751959954/Screenshot_2025-07-08_130148_kg3qdg.png" class="navimg" /></a>
    </nav>

    <div class="container" style="margin-top: 100px;">
        
        <!-- 1. LOGIN SECTION -->
        <div id="loginSection">
            <div class="row justify-content-center">
                <div class="col-12 col-md-6 col-lg-5">
                    <div class="card students-card">
                        <div class="card-body">
                            <div class="text-center mb-4">
                                <i class="fas fa-user-shield" style="font-size: 3rem; color: #02244e;"></i>
                                <h3 class="mt-3" style="color: #02244e; font-family: Almarai;">Official Login</h3>
                                <p class="text-muted">Login to manage your account</p>
                            </div>
                            
                            <form id="loginForm">
                                <div class="form-group">
                                    <label>Username</label>
                                    <input type="text" id="loginUsername" class="form-control" placeholder="Enter your username" required>
                                </div>
                                <div class="form-group">
                                    <label>Password</label>
                                    <div class="input-group">
                                        <input type="password" id="loginPassword" class="form-control" placeholder="Enter your password" required>
                                        <div class="input-group-append">
                                            <button class="btn btn-outline-secondary" type="button" onclick="togglePassword('loginPassword')">
                                                <i class="fas fa-eye" id="loginPassword-eye"></i>
                                            </button>
                                        </div>
                                    </div>
                                </div>
                                <button type="submit" class="btn btn-primary btn-block">Login</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 2. MANAGE CREDENTIALS SECTION (Hidden by default) -->
        <div id="manageSection" style="display: none;">
            <div class="row justify-content-center">
                <div class="col-12 col-md-8 col-lg-6">
                    <div class="card students-card">
                        <div class="card-body">
                            <h3 class="text-center mb-4" style="color: #02244e; font-family: Almarai;">Manage My Credentials</h3>
                            
                            <div class="alert alert-success text-center">
                                <i class="fas fa-user-check"></i> <span id="userStatus">Loading...</span>
                            </div>

                            <!-- Option 1: Change Username -->
                            <div class="card mb-4 border-primary">
                                <div class="card-header bg-white">
                                    <h5 class="mb-0 text-primary">Change Username (Display Name)</h5>
                                </div>
                                <div class="card-body">
                                    <form id="updateUsernameForm">
                                        <div class="form-group">
                                            <label>New Username</label>
                                            <input type="text" id="newUsername" class="form-control" required>
                                        </div>
                                        <div class="form-group">
                                            <label>Confirm Current Password</label>
                                            <input type="password" id="verifyPass1" class="form-control" required>
                                        </div>
                                        <button type="submit" class="btn btn-primary btn-block">Update Username</button>
                                    </form>
                                </div>
                            </div>

                            <!-- Option 2: Change Password -->
                            <div class="card border-warning">
                                <div class="card-header bg-white">
                                    <h5 class="mb-0 text-warning">Change Password</h5>
                                </div>
                                <div class="card-body">
                                    <form id="updatePasswordForm">
                                        <div class="form-group">
                                            <label>New Password</label>
                                            <div class="input-group">
                                                <input type="password" id="newPassword" class="form-control" required>
                                                <div class="input-group-append">
                                                    <button class="btn btn-outline-secondary" type="button" onclick="togglePassword('newPassword')">
                                                        <i class="fas fa-eye" id="newPassword-eye"></i>
                                                    </button>
                                                </div>
                                            </div>
                                            <small class="text-muted">Min 6 chars</small>
                                        </div>
                                        <div class="form-group">
                                            <label>Confirm New Password</label>
                                            <input type="password" id="confirmNewPassword" class="form-control" required>
                                        </div>
                                        <div class="form-group">
                                            <label>Confirm Current Password</label>
                                            <input type="password" id="verifyPass2" class="form-control" required>
                                        </div>
                                        <button type="submit" class="btn btn-warning btn-block">Update Password</button>
                                    </form>
                                </div>
                            </div>

                            <button class="btn btn-outline-danger btn-block mt-4" onclick="logout()">Logout</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const supabaseClient = window.supabaseClient;

        let currentUserId = null;
        let currentUserEmail = null;

        // Toggle Password Visibility
        window.togglePassword = function(id) {
            const input = document.getElementById(id);
            const eyeIcon = document.getElementById(id + '-eye');
            if (input.type === 'password') {
                input.type = 'text';
                if(eyeIcon) { eyeIcon.classList.remove('fa-eye'); eyeIcon.classList.add('fa-eye-slash'); }
            } else {
                input.type = 'password';
                if(eyeIcon) { eyeIcon.classList.remove('fa-eye-slash'); eyeIcon.classList.add('fa-eye'); }
            }
        };

        // 1. LOGIN HANDLER
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value;

            // Create email from username (e.g. "Basheer Wafy" -> "basheerwafy@official.com")
            const cleanName = username.replace(/\s+/g, '').toLowerCase();
            const email = cleanName + '@official.com';

            const { data, error } = await supabaseClient.auth.signInWithPassword({ email: email, password: password });

            if (error) {
                alert("Login Failed: " + error.message);
                return;
            }

            // Check Role in Officials Table
            const { data: official, error: roleError } = await supabaseClient
                .from('officials')
                .select('*')
                .eq('id', data.user.id)
                .single();

            if (roleError || !official) {
                alert("Access Denied: You are not listed as an official.");
                await supabaseClient.auth.signOut();
                return;
            }

            setupSession(official);
        });

        function setupSession(official) {
            currentUserId = official.id;
            currentUserEmail = official.username.replace(/\s+/g, '').toLowerCase() + '@official.com';

            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('manageSection').style.display = 'block';
            document.getElementById('userStatus').innerHTML = `Logged in as: <strong>${official.username}</strong> (${official.role})`;
            
            // Pre-fill username field
            document.getElementById('newUsername').value = official.username;
        }

        // 2. UPDATE USERNAME HANDLER
        document.getElementById('updateUsernameForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const newName = document.getElementById('newUsername').value.trim();
            const currentPass = document.getElementById('verifyPass1').value;

            if (!newName) return alert("Please enter a username.");

            // Re-verify password before sensitive change
            const { error: verifyError } = await supabaseClient.auth.signInWithPassword({
                email: currentUserEmail,
                password: currentPass
            });

            if (verifyError) return alert("Incorrect Password.");

            // Update DB
            const { error: updateError } = await supabaseClient
                .from('officials')
                .update({ username: newName })
                .eq('id', currentUserId);

            if (updateError) {
                alert("Error updating username: " + updateError.message);
            } else {
                alert("Username updated successfully! Please log in again.");
                logout();
            }
        });

        // 3. UPDATE PASSWORD HANDLER
        document.getElementById('updatePasswordForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const newPass = document.getElementById('newPassword').value;
            const confirmPass = document.getElementById('confirmNewPassword').value;
            const currentPass = document.getElementById('verifyPass2').value;

            if (newPass.length < 6) return alert("New password must be at least 6 characters.");
            if (newPass !== confirmPass) return alert("New passwords do not match.");

            // Re-verify password
            const { error: verifyError } = await supabaseClient.auth.signInWithPassword({
                email: currentUserEmail,
                password: currentPass
            });

            if (verifyError) return alert("Incorrect Current Password.");

            // Update Password
            const { error: updateError } = await supabaseClient.auth.updateUser({ password: newPass });

            if (updateError) {
                alert("Error updating password: " + updateError.message);
            } else {
                alert("Password updated successfully! Please log in again.");
                logout();
            }
        });

        window.logout = async function() {
            await supabaseClient.auth.signOut();
            location.reload();
        };

        // Auto-login check (optional)
        async function checkSession() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                const { data: official } = await supabaseClient.from('officials').select('*').eq('id', session.user.id).single();
                if (official) setupSession(official);
            }
        }
        checkSession();
    </script>
</body>
</html>
