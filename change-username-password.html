<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Change Username/Password</title>
    <link rel="stylesheet" href="sc.css" />
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light fixed-top">
        <a class="navbar-brand" href="index.html"><img src="https://res.cloudinary.com/dh5jui6pu/image/upload/v1751959954/Screenshot_2025-07-08_130148_kg3qdg.png" class="navimg" /></a>
    </nav>

    <div class="container" style="margin-top:120px;">
        <div class="row">
            <div class="col-12">
                <h3 class="mb-4 text-center">Change Username/Password</h3>
                
                <!-- Change Username Bar -->
                <a href="change-chief-username.html" style="text-decoration: none; color: inherit;">
                    <div class="card students-card mb-3" style="cursor: pointer; transition: transform 0.2s;"
                         onmouseover="this.style.transform='scale(1.02)'" 
                         onmouseout="this.style.transform='scale(1)'">
                        <div class="card-body">
                            <h5 class="mb-0">Change Username</h5>
                        </div>
                    </div>
                </a>
                
                <!-- Change Password Bar -->
                <a href="change-chief-password.html" style="text-decoration: none; color: inherit;">
                    <div class="card students-card" style="cursor: pointer; transition: transform 0.2s;"
                         onmouseover="this.style.transform='scale(1.02)'" 
                         onmouseout="this.style.transform='scale(1)'">
                        <div class="card-body">
                            <h5 class="mb-0">Change Password</h5>
                        </div>
                    </div>
                </a>
                
                <!-- Back Button -->
                <a href="chief-admin-main.html" class="btn btn-secondary btn-block mt-3">Back</a>
            </div>
        </div>
    </div>
</body>
</html>
