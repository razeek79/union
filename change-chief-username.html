<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Change Username</title>
    <link rel="stylesheet" href="sc.css" />
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light fixed-top">
        <a class="navbar-brand" href="index.html"><img src="https://res.cloudinary.com/dh5jui6pu/image/upload/v1751959954/Screenshot_2025-07-08_130148_kg3qdg.png" class="navimg" /></a>
    </nav>

    <div class="container" style="margin-top:120px;">
        <div class="row">
            <div class="col-12 col-md-6 offset-md-3">
                <div class="card students-card">
                    <div class="card-body">
                        <h3 class="text-center mb-4">Change Chief Admin Username</h3>
                        <form id="changeUsernameForm">
                            <div class="form-group">
                                <label>Old Username</label>
                                <input type="text" id="oldUsername" class="form-control" required />
                            </div>
                            <div class="form-group">
                                <label>Password</label>
                                <input type="password" id="password" class="form-control" required />
                            </div>
                            <div class="form-group">
                                <label>New Username</label>
                                <input type="text" id="newUsername" class="form-control" required />
                            </div>
                            <button type="submit" class="btn btn-dark btn-block">Change Username</button>
                            <a href="change-username-password.html" class="btn btn-secondary btn-block mt-2">Back</a>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function getChiefAdmin(){const v=localStorage.getItem('chiefAdmin'); return v?JSON.parse(v):null}
        function saveChiefAdmin(data){localStorage.setItem('chiefAdmin',JSON.stringify(data));}
        
        document.getElementById('changeUsernameForm').addEventListener('submit', function(e){
            e.preventDefault();
            const oldUsername = document.getElementById('oldUsername').value.trim();
            const password = document.getElementById('password').value;
            const newUsername = document.getElementById('newUsername').value.trim();
            
            if(!oldUsername || !password || !newUsername){
                alert('Please fill all fields.');
                return;
            }
            
            if(oldUsername === newUsername){
                alert('New username must be different from current username.');
                return;
            }
            
            const chiefAdmin = getChiefAdmin();
            if(!chiefAdmin){
                alert('Chief Admin credentials not set.');
                window.location.href = 'manage-officials.html';
                return;
            }
            
            if(oldUsername !== chiefAdmin.username){
                alert('Incorrect username.');
                return;
            }
            
            if(password !== chiefAdmin.password){
                alert('Incorrect password.');
                return;
            }
            
            chiefAdmin.username = newUsername;
            saveChiefAdmin(chiefAdmin);
            alert('Username changed successfully!');
            this.reset();
        });
    </script>
</body>
</html>
