<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chief Admin - Login</title>
    <link rel="stylesheet" href="sc.css" />
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light fixed-top">
        <a class="navbar-brand" href="index.html"><img src="https://res.cloudinary.com/dh5jui6pu/image/upload/v1751959954/Screenshot_2025-07-08_130148_kg3qdg.png" class="navimg" /></a>
    </nav>

    <div class="container" style="margin-top:120px;">
        <div class="row">
            <div class="col-12 col-md-6 offset-md-3">
                <div class="card students-card">
                    <div class="card-body">
                        <h3 class="text-center mb-4">Chief Admin Login</h3>
                        <form id="loginForm">
                            <div class="form-group">
                                <label>Password</label>
                                <input type="password" id="password" class="form-control" required />
                            </div>
                            <button type="submit" class="btn btn-dark btn-block">Login</button>
                            <a href="manage-officials.html" class="btn btn-secondary btn-block mt-2">Back</a>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function getChiefAdmin(){const v=localStorage.getItem('chiefAdmin'); return v?JSON.parse(v):null}
        function getPowerAccessList(){const v=localStorage.getItem('powerAccessList'); return v?JSON.parse(v):[]}
        function getRKUsers(){const v=localStorage.getItem('rkUsers'); return v?JSON.parse(v):[]}
        
        document.getElementById('loginForm').addEventListener('submit', function(e){
            e.preventDefault();
            const password = document.getElementById('password').value;
            const chiefAdmin = getChiefAdmin();
            const powerAccessList = getPowerAccessList();
            const officials = getRKUsers();
            
            // Check if it's Chief Admin password
            if(chiefAdmin && password === chiefAdmin.password){
                window.location.href = 'chief-admin-main.html';
                return;
            }
            
            // Check if it's an official with power access
            for(let official of officials){
                if(official.password === password && powerAccessList.includes(official.username)){
                    window.location.href = 'chief-admin-main.html';
                    return;
                }
            }
            
            // If none match, show error
            if(chiefAdmin){
                alert('Incorrect password!');
            } else {
                alert('Chief Admin credentials not set.');
                window.location.href = 'manage-officials.html';
            }
        });
    </script>
</body>
</html>
