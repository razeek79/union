<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chief Admin - Dashboard</title>
    <link rel="stylesheet" href="sc.css" />
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light fixed-top">
        <a class="navbar-brand" href="index.html"><img src="https://res.cloudinary.com/dh5jui6pu/image/upload/v1751959954/Screenshot_2025-07-08_130148_kg3qdg.png" class="navimg" /></a>
    </nav>

    <script>
        const role = localStorage.getItem('mgmtUserRole');
        if (role !== 'chief_admin') {
            alert('Access Restricted: Chief Admin Only');
            window.location.href = 'rk-login.html';
        }
    </script>

    <div class="container" style="margin-top:120px;">
        <div class="row">
            <div class="col-12">
                <h3 class="mb-4 text-center">Chief Admin Dashboard</h3>
                
                <!-- Manage Officials Bar -->
                <a href="manage-officials-options.html" style="text-decoration: none; color: inherit;">
                    <div class="card students-card mb-3" style="cursor: pointer; transition: transform 0.2s;"
                         onmouseover="this.style.transform='scale(1.02)'" 
                         onmouseout="this.style.transform='scale(1)'">
                        <div class="card-body">
                            <h5 class="mb-0">Manage Officials</h5>
                        </div>
                    </div>
                </a>
                
                <!-- Change Username/Password Bar -->
                <a href="change-username-password.html" style="text-decoration: none; color: inherit;">
                    <div class="card students-card mb-3" style="cursor: pointer; transition: transform 0.2s;"
                         onmouseover="this.style.transform='scale(1.02)'" 
                         onmouseout="this.style.transform='scale(1)'">
                        <div class="card-body">
                            <h5 class="mb-0">Change Username/Password</h5>
                        </div>
                    </div>
                </a>
                
                <!-- View Passwords Bar -->
                <a href="view-passwords.html" style="text-decoration: none; color: inherit;">
                    <div class="card students-card mb-3" style="cursor: pointer; transition: transform 0.2s;"
                         onmouseover="this.style.transform='scale(1.02)'" 
                         onmouseout="this.style.transform='scale(1)'">
                        <div class="card-body">
                            <h5 class="mb-0">View Passwords</h5>
                        </div>
                    </div>
                </a>
                
                <!-- Power Access Bar -->
                <a href="power-access.html" style="text-decoration: none; color: inherit;">
                    <div class="card students-card" style="cursor: pointer; transition: transform 0.2s;"
                         onmouseover="this.style.transform='scale(1.02)'" 
                         onmouseout="this.style.transform='scale(1)'">
                        <div class="card-body">
                            <h5 class="mb-0">Power Access</h5>
                        </div>
                    </div>
                </a>
                
                <!-- Disable Bars Bar -->
                <a href="disable-bars.html" style="text-decoration: none; color: inherit;">
                    <div class="card students-card mb-3" style="cursor: pointer; transition: transform 0.2s; margin-top: 16px;"
                         onmouseover="this.style.transform='scale(1.02)'" 
                         onmouseout="this.style.transform='scale(1)'">
                        <div class="card-body">
                            <h5 class="mb-0">Disable Bars for Students</h5>
                        </div>
                    </div>
                </a>
                
                <!-- Back Button -->
                <a href="manage-officials.html" class="btn btn-secondary btn-block mt-3">Back</a>
            </div>
        </div>
    </div>
</body>
</html>
