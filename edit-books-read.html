<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Edit Books Read - الأبطال</title>
    <link rel="stylesheet" href="sc.css" />
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* Responsive adjustments */
        @media (max-width: 768px) {
            h1 { font-size: 1.8rem; }
            h2 { font-size: 1.4rem; }
            
            /* Card Text Sizing */
            .students-card h5 {
                font-size: 0.95rem; 
                margin-bottom: 2px;
                word-wrap: break-word;
            }
            .students-card h6 {
                font-size: 0.8rem;
            }

            /* Adjust column layout for list items */
            .book-row .col-1, .book-row .col-3, .book-row .col-2 {
                padding-left: 5px;
                padding-right: 5px;
            }
            
            /* Button adjustments */
            .btn-sm {
                padding: 0.25rem 0.4rem;
                font-size: 0.75rem;
            }
            
            /* Add button spacing */
            .add-btn-col {
                margin-top: 10px;
                display: flex;
                gap: 5px;
            }
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light fixed-top">
        <a class="navbar-brand" href="index.html"><img src="https://res.cloudinary.com/dh5jui6pu/image/upload/v1751959954/Screenshot_2025-07-08_130148_kg3qdg.png" class="navimg" /></a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ml-auto">
                <li class="nav-item"><a class="nav-link" href="main.html">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="students-info.html">Students Info</a></li>
                <li class="nav-item active"><a class="nav-link" href="students-progress.html">Students Progress</a></li>
                <li class="nav-item"><a class="nav-link" href="council.html">Our Council</a></li>
            </ul>
        </div>
    </nav>

    <div class="container mt-5" style="margin-top: 100px !important;">
        <div class="row">
            <div class="col-12">
                <h1 class="text-center mb-5" style="font-family: Almarai; color: #02244e;">Edit Books Read</h1>
                <h2 class="text-center mb-5" style="font-family: Almarai; color: #02244e;" id="studentNameTitle">Loading...</h2>
            </div>
        </div>

        <div class="row mb-4">
            <div class="col-12">
                <div class="card students-card">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <h3 class="card-title m-0" style="font-family: Almarai; color: #02244e;" id="formTitle">Add New Book</h3>
                            <button type="button" class="btn btn-secondary btn-sm" id="cancelEditBtn" style="display: none;" onclick="resetForm()">
                                <i class="fas fa-times"></i> Cancel Edit
                            </button>
                        </div>
                        <form id="addBookForm">
                            <div class="row">
                                <div class="col-md-3 col-12 mb-2">
                                    <div class="form-group mb-0">
                                        <label style="font-family: Almarai; color: #02244e; font-weight: bold;">Book Name</label>
                                        <input type="text" class="form-control" id="bookName" required style="font-family: Almarai;">
                                    </div>
                                </div>
                                <div class="col-md-3 col-12 mb-2">
                                    <div class="form-group mb-0">
                                        <label style="font-family: Almarai; color: #02244e; font-weight: bold;">Poet/Author</label>
                                        <input type="text" class="form-control" id="poetName" required style="font-family: Almarai;">
                                    </div>
                                </div>
                                <div class="col-md-2 col-6 mb-2">
                                    <div class="form-group mb-0">
                                        <label style="font-family: Almarai; color: #02244e; font-weight: bold;">Pages</label>
                                        <input type="number" class="form-control" id="numPages" required style="font-family: Almarai;" min="1">
                                    </div>
                                </div>
                                <div class="col-md-3 col-6 mb-2">
                                    <div class="form-group mb-0">
                                        <label style="font-family: Almarai; color: #02244e; font-weight: bold;">Date</label>
                                        <input type="date" class="form-control" id="bookDate" required style="font-family: Almarai;">
                                    </div>
                                </div>
                                <div class="col-md-1 col-12 add-btn-col">
                                    <label class="d-none d-md-block">&nbsp;</label>
                                    <button type="submit" class="btn btn-primary btn-block" id="submitBtn" style="font-family: Almarai;">
                                        <i class="fas fa-plus"></i> Add
                                    </button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <div class="row mb-3 d-none d-md-flex"> <div class="col-12">
                <div class="card students-card">
                    <div class="card-body">
                        <div class="row align-items-center">
                            <div class="col-1 text-center"><h5 style="margin: 0; font-weight: bold;">#</h5></div>
                            <div class="col-3 text-center"><h5 style="margin: 0; font-weight: bold;">Book</h5></div>
                            <div class="col-3 text-center"><h5 style="margin: 0; font-weight: bold;">Author</h5></div>
                            <div class="col-1 text-center"><h5 style="margin: 0; font-weight: bold;">Pg</h5></div>
                            <div class="col-2 text-center"><h5 style="margin: 0; font-weight: bold;">Date</h5></div>
                            <div class="col-2 text-center"><h5 style="margin: 0; font-weight: bold;">Action</h5></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row" id="booksList">
            </div>

        <div class="row" id="noBooksMessage" style="display: none;">
            <div class="col-12 text-center">
                <div class="card students-card">
                    <div class="card-body">
                        <i class="fas fa-book" style="font-size: 4rem; color: #6c757d; margin-bottom: 1rem;"></i>
                        <h3 class="text-muted mt-3">No Books Added</h3>
                    </div>
                </div>
            </div>
        </div>

        <div class="row mt-4">
            <div class="col-12 text-center">
                <a href="#" class="btn btn-secondary btn-lg" id="backBtn" style="font-family: Almarai;">
                    <i class="fas fa-arrow-left"></i> Back
                </a>
            </div>
        </div>
    </div>

    <script>
        const supabaseClient = window.supabaseClient;

        let currentStudentId = null;
        let currentBooksList = []; // Store fetched books locally for editing
        let editingBookId = null; // Track if we are editing

        function getQueryParam(key) {
            return new URLSearchParams(window.location.search).get(key);
        }

        // 1. Load Student & Books
        async function loadData() {
            const cicNo = getQueryParam('cicNo');
            if (!cicNo) return alert("Missing CIC No.");

            const { data: student, error } = await supabaseClient
                .from('students')
                .select('id, full_name, cic_no')
                .eq('cic_no', cicNo)
                .single();

            if (error || !student) {
                document.getElementById('studentNameTitle').textContent = "Student Not Found";
                return;
            }

            currentStudentId = student.id;
            document.getElementById('studentNameTitle').textContent = `${student.full_name} (${student.cic_no})`;
            document.getElementById('backBtn').href = `edit-student-progress.html?cicNo=${student.cic_no}`;

            loadBooks();
        }

        // 2. Fetch Books
        async function loadBooks() {
            const { data: books, error } = await supabaseClient
                .from('books')
                .select('id, name, poet, pages, date') 
                .eq('student_id', currentStudentId)
                .order('date', { ascending: false });

            if (error) {
                alert("Error loading books: " + error.message);
                return;
            }

            currentBooksList = books || []; // Store globally for edit function
            renderBooks(currentBooksList);
        }

        function renderBooks(books) {
            const list = document.getElementById('booksList');
            list.innerHTML = '';

            if (!books || books.length === 0) {
                document.getElementById('noBooksMessage').style.display = 'block';
                return;
            }
            document.getElementById('noBooksMessage').style.display = 'none';

            books.forEach((book, index) => {
                // Formatting date safely
                const displayDate = book.date ? book.date.split('T')[0] : '-';

                list.innerHTML += `
                <div class="col-12 mb-3">
                    <div class="card students-card">
                        <div class="card-body p-3">
                            <div class="row align-items-center book-row">
                                <div class="col-1 col-md-1 text-center font-weight-bold d-md-block d-none">
                                    <h5>${index + 1}</h5>
                                </div>
                                
                                <div class="col-12 col-md-3 text-center text-md-center mb-2 mb-md-0">
                                    <h5 class="text-primary font-weight-bold">${book.name}</h5>
                                    <small class="d-md-none text-muted">Book</small>
                                </div>
                                
                                <div class="col-6 col-md-3 text-center mb-2 mb-md-0">
                                    <h5>${book.poet}</h5>
                                    <small class="d-md-none text-muted">Author</small>
                                </div>
                                
                                <div class="col-3 col-md-1 text-center mb-2 mb-md-0">
                                    <h5>${book.pages}</h5>
                                    <small class="d-md-none text-muted">Pages</small>
                                </div>
                                
                                <div class="col-3 col-md-2 text-center mb-2 mb-md-0">
                                    <h6 class="text-muted">${displayDate}</h6>
                                    <small class="d-md-none text-muted">Date</small>
                                </div>
                                
                                <div class="col-12 col-md-2 text-center mt-2 mt-md-0">
                                    <div class="btn-group w-100" role="group">
                                        <button class="btn btn-warning btn-sm" onclick="editBook('${book.id}')" title="Edit">
                                            <i class="fas fa-pen"></i> <span class="d-md-none">Edit</span>
                                        </button>
                                        <button class="btn btn-danger btn-sm" onclick="deleteBook('${book.id}')" title="Delete">
                                            <i class="fas fa-trash"></i> <span class="d-md-none">Delete</span>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>`;
            });
        }

        // 3. Edit Logic (Corrected Date Parsing)
        window.editBook = function(id) {
            console.log("Editing Book ID:", id);
            const book = currentBooksList.find(b => b.id === id);
            
            if(!book) {
                console.error("Book data not found locally.");
                return;
            }

            // Populate Form
            document.getElementById('bookName').value = book.name;
            document.getElementById('poetName').value = book.poet;
            document.getElementById('numPages').value = book.pages;
            
            // Safe Date Formatting for Input
            if(book.date) {
                document.getElementById('bookDate').value = book.date.split('T')[0];
            } else {
                document.getElementById('bookDate').value = "";
            }

            // Change UI State
            editingBookId = id;
            document.getElementById('formTitle').innerText = "Edit Book";
            document.getElementById('formTitle').className = "card-title m-0 text-warning";
            
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.innerHTML = '<i class="fas fa-save"></i> Update';
            submitBtn.classList.remove('btn-primary');
            submitBtn.classList.add('btn-success');

            document.getElementById('cancelEditBtn').style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' }); // Scroll to top
        };

        window.resetForm = function() {
            document.getElementById('addBookForm').reset();
            editingBookId = null;
            
            document.getElementById('formTitle').innerText = "Add New Book";
            document.getElementById('formTitle').className = "card-title m-0 text-primary"; // Reset color
            
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.innerHTML = '<i class="fas fa-plus"></i> Add';
            submitBtn.classList.remove('btn-success');
            submitBtn.classList.add('btn-primary');

            document.getElementById('cancelEditBtn').style.display = 'none';
        };

        // 4. Handle Submit (Add or Update)
        document.getElementById('addBookForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const name = document.getElementById('bookName').value;
            const poet = document.getElementById('poetName').value;
            const pages = document.getElementById('numPages').value;
            const date = document.getElementById('bookDate').value; 

            if (!date) return alert("Please select the date finished");

            const btn = document.getElementById('submitBtn');
            btn.disabled = true;

            let error;

            if (editingBookId) {
                // UPDATE Existing
                console.log("Updating book...");
                const { error: updateError } = await supabaseClient
                    .from('books')
                    .update({ name, poet, pages, date })
                    .eq('id', editingBookId);
                error = updateError;
            } else {
                // INSERT New
                console.log("Inserting book...");
                const { error: insertError } = await supabaseClient
                    .from('books')
                    .insert([{
                        student_id: currentStudentId,
                        name: name,
                        poet: poet,
                        pages: pages,
                        date: date 
                    }]);
                error = insertError;
            }

            btn.disabled = false;

            if (error) {
                alert("Error saving: " + error.message);
                console.error(error);
            } else {
                resetForm();
                loadBooks();
            }
        });

        // 5. Delete Book
        window.deleteBook = async function(id) {
            if (!confirm("Delete this book?")) return;

            const { error } = await supabaseClient
                .from('books')
                .delete()
                .eq('id', id);

            if (error) alert("Error deleting: " + error.message);
            else {
                // If we deleted the book currently being edited, reset form
                if(editingBookId === id) resetForm();
                loadBooks();
            }
        };

        document.addEventListener('DOMContentLoaded', loadData);
    </script>
</body>
</html>
