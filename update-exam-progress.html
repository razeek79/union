<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Exam Progress</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        .big-bar {
            border-radius: 16px;
            background: #f5f7fa;
            box-shadow: 0 2px 12px rgba(41,94,148,0.12);
            padding: 48px 24px;
            font-size: 2rem;
            color: #02244e;
            text-align: center;
            margin-bottom: 40px;
            cursor: pointer;
            font-family: Almarai, Arial, sans-serif;
            transition: box-shadow .2s, background .2s;
        }
        .big-bar:hover {
            background: #e1eafd;
            box-shadow: 0 4px 28px rgba(41,94,148,0.18);
        }
        .container-bar {
            margin: 80px auto 0 auto;
            max-width: 600px;
        }
        h1 {
            color: #02244e;
            font-family: Almarai, Arial, sans-serif;
            margin-bottom: 48px;
            margin-top: 70px;
        }
    </style>
    <script src="exam-access.js"></script>
    <script src="exam-access-guard.js"></script>
</head>
<body>
    <div class="container container-bar text-center">
        <h1>Update Exam Progress</h1>
        <div class="big-bar" onclick="window.location.href='update-exam-progress-wafy.html'+window.location.search">Wafy Results</div>
        <div class="big-bar" onclick="window.location.href='update-exam-progress-highersec.html'+window.location.search;">Higher Secondary and UG Results</div>
        <div class="mt-5">
            <a href="javascript:history.back()" class="btn btn-secondary btn-lg">Back</a>
        </div>
    </div>
    <script>
    function isOfficial() {
        if (window.examAccess && examAccess.hasPermission()) {
            return true;
        }
        // fallback for legacy flags
        const role = localStorage.getItem('userRole');
        return role === 'official' || role === 'admin' || role === 'mentor';
    }
    function checkEditExamProgressDisabled() {
        if (isOfficial()) return;
        const disabled = (localStorage.getItem('disabledBars') ? JSON.parse(localStorage.getItem('disabledBars')) : []);
        if (disabled.includes('edit-exam-progress')) {
            document.body.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:85vh;font-size:2rem;color:#c00;font-family:Almarai,Arial,sans-serif;font-weight:bold;">Disabled by Admin</div>';
        }
    }
    document.addEventListener('DOMContentLoaded', checkEditExamProgressDisabled);
    </script>
</body>
</html>
