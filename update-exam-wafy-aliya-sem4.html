<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Update Wafy Results</title>
  <link rel="stylesheet" href="sc.css">
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
  <style>
      .editable-cell { cursor: pointer; background: #fff; }
      .editable-cell:hover { background-color: #f1f7ff; outline: 1px solid #007bff; }
      .editable-cell:focus { outline: 2px solid #007bff; background-color: #fff; }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-light bg-light fixed-top">
      <a class="navbar-brand" href="index.html"><img src="https://res.cloudinary.com/dh5jui6pu/image/upload/v1751959954/Screenshot_2025-07-08_130148_kg3qdg.png" class="navimg" /></a>
  </nav>

  <div class="container" style="margin-top: 100px; max-width: 1200px;">
    <div class="card students-card">
      <div class="card-body">
        <h3 class="text-center mb-4" style="color: #02244e; font-family: Almarai;">Update Wafy Results</h3>
        <h5 id="studentNameDisplay" class="text-center text-muted mb-4">Loading...</h5>

        <div class="d-flex justify-content-between align-items-center mb-3">
            <div>
                <input type="file" id="fileInput" accept=".xlsx,.xls,.csv" style="display:none" onchange="handleFileUpload(event)">
                <button class="btn btn-success" onclick="document.getElementById('fileInput').click()"><i class="fas fa-file-excel"></i> Import Excel</button>
            </div>
            <div>
                <button class="btn btn-primary" onclick="saveTableData()"><i class="fas fa-save"></i> Save</button>
                <button class="btn btn-danger ml-2" onclick="deleteResults()"><i class="fas fa-trash"></i> Clear</button>
            </div>
        </div>

        <div class="alert alert-info p-2 text-center">
            <small><strong>Columns:</strong> Subject | Ce Mark | Ce Max | Te Mark | Te Max | Total | Max | Status | Exam Mode</small>
        </div>

        <div id="previewSection" style="display:none;">
            <div class="table-responsive">
                <table class="table table-bordered table-striped text-center" id="resultsTable">
                    <thead class="thead-dark">
                        <tr>
                            <th>Subject</th>
                            <th>CE Mark</th><th>CE Max</th>
                            <th>TE Mark</th><th>TE Max</th>
                            <th>Total</th><th>Max</th>
                            <th>Status</th><th>Exam Mode</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
                <button class="btn btn-outline-secondary btn-sm mb-3" onclick="addNewRow()">+ Add Row</button>
            </div>
        </div>
        <div id="noDataMsg" class="text-center text-muted mt-5" style="display:none;">No results found.</div>
      </div>
    </div>
    <div class="text-center mt-3"><a href="update-exam-progress-wafy.html" class="btn btn-secondary">Back</a></div>
  </div>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

  <script>
    const supabaseClient = window.supabaseClient;
    // --- CONFIG FOR WAFY ---
    const SEMESTER_KEY = 'wafy_aliya_sem4'; // <--- CHANGE THIS FOR OTHER SEMESTERS
    const TABLE_KEYS = ["subject", "ce_mark", "ce_max", "te_mark", "te_max", "total", "max", "status", "exam_mode"];
    
    // --- SUPABASE ---
    let currentStudentId = null;

    async function init() {
        // Safer Auth Check
        const role = localStorage.getItem('mgmtUserRole');
        if (!role) {
            document.body.innerHTML = '<div class="container mt-5 alert alert-danger text-center">Access Denied. Please <a href="index.html">Log In</a>.</div>';
            return;
        }

        const cicNo = new URLSearchParams(window.location.search).get('cicNo');
        if (!cicNo) return alert("Missing CIC No.");
        
        const { data: student, error } = await supabaseClient.from('students').select('id, full_name, cic_no').eq('cic_no', cicNo).single();
        if (error || !student) return alert("Student Not Found");
        
        currentStudentId = student.id;
        document.getElementById('studentNameDisplay').textContent = `${student.full_name} (${student.cic_no})`;
        loadExistingResults();
    }

    async function loadExistingResults() {
        const { data } = await supabaseClient.from('semester_results').select('results_data').match({ student_id: currentStudentId, semester_key: SEMESTER_KEY }).single();
        if (data?.results_data?.length > 0) renderTable(data.results_data);
        else { document.getElementById('noDataMsg').style.display = 'block'; document.getElementById('previewSection').style.display = 'none'; }
    }

    function renderTable(data) {
        document.getElementById('tableBody').innerHTML = '';
        data.forEach(row => addRowToTable(row));
        document.getElementById('previewSection').style.display = 'block';
        document.getElementById('noDataMsg').style.display = 'none';
    }

    function addRowToTable(rowData = {}) {
        const tr = document.createElement('tr');
        TABLE_KEYS.forEach(key => {
            const td = document.createElement('td');
            td.contentEditable = true; td.className = 'editable-cell';
            // Helper to find key even if casing/spaces differ
            const val = rowData[key] || rowData[key.replace(/_/g, ' ')] || rowData[key.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase())] || '';
            td.textContent = val; td.dataset.key = key;
            tr.appendChild(td);
        });
        const actionTd = document.createElement('td');
        actionTd.innerHTML = `<button class="btn btn-sm btn-danger" onclick="this.closest('tr').remove()"><i class="fas fa-times"></i></button>`;
        tr.appendChild(actionTd);
        document.getElementById('tableBody').appendChild(tr);
    }
    function addNewRow() { addRowToTable({}); }

    function handleFileUpload(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(evt) {
            const wb = XLSX.read(evt.target.result, {type: 'binary'});
            const jsonData = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
            if(confirm("Replace current data?")) renderTable(jsonData);
        };
        reader.readAsBinaryString(file);
    }

    async function saveTableData() {
        if (!currentStudentId) return;
        const rows = document.querySelectorAll('#tableBody tr');
        const dataToSave = [];
        rows.forEach(tr => {
            const rowObj = {}; let hasData = false;
            tr.querySelectorAll('td.editable-cell').forEach(td => {
                rowObj[td.dataset.key] = td.textContent.trim();
                if(td.textContent.trim()) hasData = true;
            });
            if (hasData) dataToSave.push(rowObj);
        });

        await supabaseClient.from('semester_results').delete().match({ student_id: currentStudentId, semester_key: SEMESTER_KEY });
        const { error } = await supabaseClient.from('semester_results').insert([{ student_id: currentStudentId, semester_key: SEMESTER_KEY, results_data: dataToSave }]);
        if (error) alert(error.message); else alert("Saved!");
    }

    async function deleteResults() {
        if(!confirm("Delete all?")) return;
        await supabaseClient.from('semester_results').delete().match({ student_id: currentStudentId, semester_key: SEMESTER_KEY });
        location.reload();
    }

    // --- AUTO CALCULATION LOGIC (Vertical, Horizontal & Status) ---
    
    document.getElementById('tableBody').addEventListener('input', function(e) {
        const td = e.target;
        if (!td.classList.contains('editable-cell')) return;

        const key = td.dataset.key;
        const tr = td.closest('tr');
        
        // 1. Horizontal Calculation: Update the current row's totals and status
        // We exclude the last row from this check so we don't overwrite "Passed/Failed" with "P/F"
        const tableBody = document.getElementById('tableBody');
        if (tr !== tableBody.lastElementChild) {
             if (['ce_mark', 'te_mark', 'ce_max', 'te_max'].includes(key)) {
                updateRowTotals(tr);
            }
        }
        
        // 2. Vertical Calculation: Update the Grand Total Row
        if (['ce_mark', 'ce_max', 'te_mark', 'te_max', 'total', 'max', 'status'].includes(key)) {
             updateGrandTotal();
        }
    });

    // Calculates horizontal totals and P/F status for a single data row
    function updateRowTotals(tr) {
        const getVal = (k) => {
            const cell = tr.querySelector(`td[data-key="${k}"]`);
            return cell ? (parseFloat(cell.textContent.trim()) || 0) : 0;
        };

        // Calculate Sums
        const ceMark = getVal('ce_mark');
        const teMark = getVal('te_mark');
        const ceMax = getVal('ce_max');
        const teMax = getVal('te_max');

        const totalCell = tr.querySelector(`td[data-key="total"]`);
        if (totalCell) totalCell.textContent = ceMark + teMark;

        const maxCell = tr.querySelector(`td[data-key="max"]`);
        if (maxCell) maxCell.textContent = ceMax + teMax;

        // Calculate Status: P if TE Mark >= 45% of TE Max, else F
        const statusCell = tr.querySelector(`td[data-key="status"]`);
        if (statusCell && teMax > 0) {
            // 45% threshold
            const threshold = 0.45 * teMax;
            const isPassed = teMark >= threshold;
            
            statusCell.textContent = isPassed ? 'P' : 'F';
            // Optional: Add color for better visibility
            statusCell.style.color = isPassed ? 'green' : 'red';
            statusCell.style.fontWeight = 'bold';
        }
    }

    // Calculates vertical sums and determines the overall exam status
    function updateGrandTotal() {
        const rows = document.querySelectorAll('#tableBody tr');
        // Need at least 2 rows (1 data + 1 total)
        if (rows.length < 2) return; 

        const lastRow = rows[rows.length - 1];
        
        const keys = ['ce_mark', 'ce_max', 'te_mark', 'te_max', 'total', 'max'];
        const totals = {};
        keys.forEach(k => totals[k] = 0);

        let allPassed = true;

        // Loop through all rows EXCEPT the last one
        for (let i = 0; i < rows.length - 1; i++) {
            const row = rows[i];
            
            // 1. Accumulate Sums
            keys.forEach(key => {
                const cell = row.querySelector(`td[data-key="${key}"]`);
                const val = cell ? (parseFloat(cell.textContent.trim()) || 0) : 0;
                totals[key] += val;
            });

            // 2. Check Row Status
            const statusCell = row.querySelector(`td[data-key="status"]`);
            if (statusCell) {
                const statusText = statusCell.textContent.trim().toUpperCase();
                // If any row is 'F' (or not 'P'), the grand total is Failed
                if (statusText !== 'P') {
                    allPassed = false;
                }
            }
        }

        // Apply Column Sums to Last Row
        keys.forEach(key => {
            const cell = lastRow.querySelector(`td[data-key="${key}"]`);
            if (cell) cell.textContent = totals[key];
        });

        // Apply Overall Status to Last Row
        const totalStatusCell = lastRow.querySelector(`td[data-key="status"]`);
        if (totalStatusCell) {
            totalStatusCell.textContent = allPassed ? 'Passed' : 'Failed';
            totalStatusCell.style.fontWeight = 'bold';
            totalStatusCell.style.color = allPassed ? 'green' : 'red';
        }

        // Ensure Subject column says "Total"
        const subjectCell = lastRow.querySelector('td[data-key="subject"]');
        if(subjectCell && (subjectCell.textContent.trim() === '' || subjectCell.textContent.trim().toLowerCase() === 'total')) {
            subjectCell.textContent = "Total";
            subjectCell.style.fontWeight = "bold";
        }
    }
    
    window.onload = init;
  </script>
</body>
</html>
