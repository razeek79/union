<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>View Writings - الأبطال</title>
    <link rel="stylesheet" href="sc.css" />
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light fixed-top">
        <a class="navbar-brand" href="index.html"><img src="https://res.cloudinary.com/dh5jui6pu/image/upload/v1751959954/Screenshot_2025-07-08_130148_kg3qdg.png" class="navimg" /></a>
        <button class="navbar-toggler" style="width: 60px;" type="button" data-toggle="collapse" data-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ml-auto">
                <li class="nav-item"><a class="nav-link" href="main.html">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="students-info.html">Students Info</a></li>
                <li class="nav-item active"><a class="nav-link" href="students-progress.html">Students Progress</a></li>
                <li class="nav-item"><a class="nav-link" href="council.html">Our Council</a></li>
            </ul>
        </div>
    </nav>

    <div class="container mt-5" style="margin-top: 100px !important;">
        <div class="row">
            <div class="col-12">
                <h1 class="text-center mb-5" style="font-family: Almarai; color: #02244e;">Writings</h1>
                <h2 class="text-center mb-5" style="font-family: Almarai; color: #02244e;" id="studentNameTitle">Loading...</h2>
            </div>
        </div>

        <div class="row mb-4">
            <div class="col-12">
                <div class="alert alert-info text-center" role="alert" style="font-family: Almarai;">
                    <i class="fas fa-pen-nib"></i>
                    <strong>Total Writings: </strong><span id="totalWritings">0</span>
                </div>
            </div>
        </div>

        <div class="row mb-3">
            <div class="col-12">
                <div class="card students-card">
                    <div class="card-body">
                        <div class="row align-items-center">
                            <div class="col-2 text-center"><h5 style="font-family: Almarai; color: #02244e; margin: 0; font-weight: bold;">SL No.</h5></div>
                            <div class="col-7 text-center"><h5 style="font-family: Almarai; color: #02244e; margin: 0; font-weight: bold;">Title / Topic</h5></div>
                            <div class="col-3 text-center"><h5 style="font-family: Almarai; color: #02244e; margin: 0; font-weight: bold;">Date</h5></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row" id="writingsList">
            </div>

        <div class="row" id="noWritingsMessage" style="display: none;">
            <div class="col-12 text-center">
                <div class="card students-card">
                    <div class="card-body">
                        <i class="fas fa-pen-nib" style="font-size: 4rem; color: #6c757d; margin-bottom: 1rem;"></i>
                        <h3 class="mt-3" style="font-family: Almarai; color: #6c757d;">No Writings Added</h3>
                    </div>
                </div>
            </div>
        </div>

        <div class="row mt-4">
            <div class="col-12 text-center">
                <a href="#" class="btn btn-secondary btn-lg" id="backBtn" style="font-family: Almarai;">
                    <i class="fas fa-arrow-left"></i> Back
                </a>
            </div>
        </div>
    </div>

    <script>
        const supabaseClient = window.supabaseClient;
        function getQueryParam(key) {
            return new URLSearchParams(window.location.search).get(key);
        }

        async function loadData() {
            const cicNo = getQueryParam('cicNo');
            if (!cicNo) {
                document.getElementById('studentNameTitle').textContent = "Error: Missing Student ID";
                return;
            }

            // 1. Get Student Details
            const { data: student, error } = await supabaseClient
                .from('students')
                .select('id, full_name, cic_no')
                .eq('cic_no', cicNo)
                .single();

            if (error || !student) {
                document.getElementById('studentNameTitle').textContent = "Student Not Found";
                return;
            }

            // Update UI
            document.getElementById('studentNameTitle').textContent = `${student.full_name} (${student.cic_no})`;
            document.getElementById('backBtn').href = `view-student-progress.html?cicNo=${student.cic_no}`;

            // 2. Get Writings
            const { data: writings, error: wError } = await supabaseClient
                .from('writings')
                .select('title, date')
                .eq('student_id', student.id)
                .order('date', { ascending: false });

            if (wError) {
                alert("Error loading writings: " + wError.message);
                return;
            }

            renderWritings(writings || []);
        }

        function renderWritings(list) {
            const container = document.getElementById('writingsList');
            const noMsg = document.getElementById('noWritingsMessage');
            
            document.getElementById('totalWritings').textContent = list.length;

            if (list.length === 0) {
                container.innerHTML = '';
                noMsg.style.display = 'block';
                return;
            }

            noMsg.style.display = 'none';
            container.innerHTML = '';

            list.forEach((item, index) => {
                container.innerHTML += `
                <div class="col-12 mb-3">
                    <div class="card students-card">
                        <div class="card-body">
                            <div class="row align-items-center">
                                <div class="col-2 text-center"><h5>${index + 1}</h5></div>
                                <div class="col-7 text-center"><h5>${item.title}</h5></div>
                                <div class="col-3 text-center"><h5>${item.date || '-'}</h5></div>
                            </div>
                        </div>
                    </div>
                </div>`;
            });
        }

        document.addEventListener('DOMContentLoaded', loadData);
    </script>
</body>
</html>
