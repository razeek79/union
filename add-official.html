<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Add Official</title>
    <link rel="stylesheet" href="sc.css" />
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
</head>
<body>
    <div class="container" style="margin-top:120px; max-width:720px;">
        <div class="card students-card">
            <div class="card-body">
                <h3>Add Official</h3>
                <form id="addOfficialForm">
                    <div class="form-group">
                        <label>Role</label>
                        <select id="role" class="form-control">
                            <option value="admin">Admin</option>
                            <option value="mentor">Mentor</option>
                            <option value="leader">Leader</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Username</label>
                        <input id="username" class="form-control" />
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <div class="input-group">
                            <input id="password" type="password" class="form-control" />
                            <div class="input-group-append"><button class="btn btn-outline-secondary" type="button" onclick="togglePassword('password');return false;"> <i id="password-eye" class="fas fa-eye"></i></button></div>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Confirm Password</label>
                        <div class="input-group">
                            <input id="confirmPassword" type="password" class="form-control" />
                            <div class="input-group-append"><button class="btn btn-outline-secondary" type="button" onclick="togglePassword('confirmPassword');return false;"> <i id="confirmPassword-eye" class="fas fa-eye"></i></button></div>
                        </div>
                    </div>
                    <button class="btn btn-success" type="submit">Add Official</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        const role = localStorage.getItem('mgmtUserRole');
        if (role !== 'chief_admin') {
            alert('Access Restricted: Chief Admin Only');
            window.location.href = 'rk-login.html';
        }

        function togglePassword(id){
            const i=document.getElementById(id); 
            const eye=document.getElementById(id+'-eye'); 
            if(i.type==='password'){
                i.type='text'; 
                if(eye){eye.classList.remove('fa-eye'); eye.classList.add('fa-eye-slash');}
            }else{ 
                i.type='password'; 
                if(eye){eye.classList.remove('fa-eye-slash'); eye.classList.add('fa-eye');}
            }
        }

        document.getElementById('addOfficialForm').addEventListener('submit', async function(e){
            e.preventDefault();
            const role = document.getElementById('role').value;
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if(!username || !password){
                alert('Enter username and password');
                return;
            }
            if(password !== confirmPassword){
                alert('Passwords do not match');
                return;
            }
            // Could add: password length/strength check

            // Email for auth: username w/o spaces + '@official.com'
            const email = username.replace(/\s+/g, '') + '@official.com';

            // Create Auth User
            let { data, error } = await supabaseClient.auth.signUp({
                email: email,
                password: password,
            });

            if(error){
                alert('Sign Up Error: ' + (error.message || error.description || error));
                return;
            }

            // Insert into officials table if sign up successful
            const userId = data.user?.id;
            if(!userId){
                alert("Unexpected error: No user ID from Supabase.");
                return;
            }
            // Insert to 'officials' table: id, username, role
            const { error: dbError } = await supabaseClient
                .from('officials')
                .insert([
                    { id: userId, username: username, role: role }
                ]);
            
            if(dbError){
                alert('Database Error: ' + (dbError.message || dbError.description || dbError));
                return;
            }

            alert('Official Added Successfully!');
            this.reset();
        });
    </script>
</body>
</html>
