<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Change Password</title>
    <link rel="stylesheet" href="sc.css" />
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light fixed-top">
        <a class="navbar-brand" href="index.html"><img src="https://res.cloudinary.com/dh5jui6pu/image/upload/v1751959954/Screenshot_2025-07-08_130148_kg3qdg.png" class="navimg" /></a>
    </nav>

    <div class="container" style="margin-top:120px;">
        <div class="row">
            <div class="col-12 col-md-6 offset-md-3">
                <div class="card students-card">
                    <div class="card-body">
                        <h3 class="text-center mb-4">Change Chief Admin Password</h3>
                        <form id="changePasswordForm">
                            <div class="form-group">
                                <label>Current Password</label>
                                <input type="password" id="currentPassword" class="form-control" required />
                            </div>
                            <div class="form-group">
                                <label>New Password</label>
                                <input type="password" id="newPassword" class="form-control" required />
                            </div>
                            <div class="form-group">
                                <label>Confirm New Password</label>
                                <input type="password" id="confirmPassword" class="form-control" required />
                            </div>
                            <button type="submit" class="btn btn-dark btn-block">Change Password</button>
                            <a href="change-username-password.html" class="btn btn-secondary btn-block mt-2">Back</a>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const role = localStorage.getItem('mgmtUserRole');
        if (role !== 'chief_admin') {
            alert('Access Restricted: Chief Admin Only');
            window.location.href = 'rk-login.html';
        }

        const SUPABASE_URL = 'https://ewpmkjqcjnhtxyfqgiba.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV3cG1ranFjam5odHh5ZnFnaWJhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjIzMTUyOTMsImV4cCI6MjA3Nzg5MTI5M30.i1ivEtua8fCktdit_DASxQigFg2Kb8NLn0WLLQ3LFmI';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        document.getElementById('changePasswordForm').addEventListener('submit', async function(e){
            e.preventDefault();
            const currentPassword = document.getElementById('currentPassword').value;
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            if(!currentPassword || !newPassword || !confirmPassword){
                alert('Please fill all fields.');
                return;
            }
            
            if(newPassword !== confirmPassword){
                alert('New password and confirmation do not match.');
                return;
            }

            if(newPassword.length < 6) {
                alert('New password must be at least 6 characters.');
                return;
            }
            
            // 1. Verify Old Password by Logging In
            const { error: loginError } = await supabaseClient.auth.signInWithPassword({
                email: 'razeekfariz1@gmail.com',
                password: currentPassword
            });

            if (loginError) {
                alert('Incorrect current password.');
                return;
            }

            // 2. Update to New Password
            const { error: updateError } = await supabaseClient.auth.updateUser({
                password: newPassword
            });

            if (updateError) {
                alert("Error updating password: " + updateError.message);
            } else {
                alert('Password changed successfully! Please log in with your new password.');
                // Optional: Log them out so they have to test the new password
                await supabaseClient.auth.signOut();
                window.location.href = 'rk-login.html';
            }
        });
    </script>
</body>
</html>
