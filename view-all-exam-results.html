<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Exam Results - الأبطال</title>
    <link rel="stylesheet" href="sc.css">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <!-- Supabase Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <!-- PDF Generation (Optional for printing whole page) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <style>
        body { background: #f9f9f9; font-family: Almarai, Arial, sans-serif; }
        h1, h2, h3, h4, h5 { color: #02244e; }
        
        .container { max-width: 1200px; margin-top: 100px; }
        
        /* Filter Section */
        .filter-card {
            background: #fff; border-radius: 12px; padding: 25px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05); margin-bottom: 30px;
            border-top: 5px solid #02244e;
        }

        /* Individual Student Result Block */
        .student-result-block {
            background: #fff;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 40px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border: 1px solid #e9ecef;
            page-break-inside: avoid; /* Prevents cutting tables in half when printing */
        }

        .student-header {
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 15px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }

        .student-info h4 { font-weight: bold; margin: 0; }
        .student-info span { font-size: 1.1rem; color: #666; }

        /* Table Styles */
        .table thead th {
            background-color: #02244e;
            color: white;
            border: none;
            vertical-align: middle;
        }
        
        /* Marks & Status Styling */
        .mark-low { color: #dc3545; font-weight: bold; }
        .percentage-col { font-weight: bold; color: #02244e; }
        
        .status-passed { color: #28a745; font-weight: bold; }
        .status-failed { color: #dc3545; font-weight: bold; }

        /* Print Button */
        .print-fab {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 1000;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        @media print {
            .no-print { display: none !important; }
            .container { margin-top: 0; max-width: 100%; }
            .student-result-block { box-shadow: none; border: 1px solid #ccc; }
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-light bg-light fixed-top no-print">
    <a class="navbar-brand" href="index.html"><img src="https://res.cloudinary.com/dh5jui6pu/image/upload/v1751959954/Screenshot_2025-07-08_130148_kg3qdg.png" class="navimg" /></a>
    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ml-auto">
            <li class="nav-item"><a class="nav-link" href="main.html">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="students-progress.html">Students Progress</a></li>
        </ul>
    </div>
</nav>

<div class="container">
    <h2 class="text-center mb-4 no-print" style="font-weight: bold;">All Student Result Sheets</h2>

    <!-- Filter Section -->
    <div class="filter-card no-print">
        <div class="row align-items-end">
            <div class="col-md-4">
                <div class="form-group mb-0">
                    <label class="font-weight-bold">1. Select Course</label>
                    <select id="courseType" class="form-control" onchange="updateSemesterOptions()">
                        <option value="">-- Choose Course --</option>
                        <option value="wafy">Wafy (Thamheediyya / Aliya)</option>
                        <option value="degree">Degree</option>
                        <option value="highersec">Higher Secondary</option>
                    </select>
                </div>
            </div>
            <div class="col-md-4">
                <div class="form-group mb-0">
                    <label class="font-weight-bold">2. Select Semester</label>
                    <select id="semesterSelect" class="form-control" disabled>
                        <option value="">-- Select Course First --</option>
                    </select>
                </div>
            </div>
            <div class="col-md-4">
                <button class="btn btn-primary btn-block font-weight-bold" onclick="fetchAllResults()">
                    Load All Sheets
                </button>
            </div>
        </div>
    </div>

    <!-- Results Container -->
    <div id="resultsContainer"></div>

    <!-- Loading Spinner -->
    <div id="loadingSpinner" class="text-center my-5" style="display:none;">
        <div class="spinner-border text-primary" style="width: 3rem; height: 3rem;"></div>
        <p class="mt-2 text-muted">Generating report cards...</p>
    </div>

    <!-- Print Button -->
    <button class="btn btn-lg btn-danger no-print" onclick="window.print()" title="Print / Save as PDF">
        <i class="fas fa-print"></i>
    </button>

    <div class="mt-5 text-center mb-5 no-print">
        <a href="students-progress.html" class="btn btn-secondary btn-lg px-5">Back to Menu</a>
    </div>
</div>

<!-- Font Awesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

<script>
    // --- CONFIGURATION ---
    const CONFIG = {
        wafy: {
            sems: [
                {k: 'wafy_thamheediyya_sem1', v: 'Thamheediyya Sem 1'}, {k: 'wafy_thamheediyya_sem2', v: 'Thamheediyya Sem 2'},
                {k: 'wafy_thamheediyya_sem3', v: 'Thamheediyya Sem 3'}, {k: 'wafy_thamheediyya_sem4', v: 'Thamheediyya Sem 4'},
                {k: 'wafy_aliya_sem1', v: 'Aliya Sem 1'}, {k: 'wafy_aliya_sem2', v: 'Aliya Sem 2'},
                {k: 'wafy_aliya_sem3', v: 'Aliya Sem 3'}, {k: 'wafy_aliya_sem4', v: 'Aliya Sem 4'},
                {k: 'wafy_aliya_sem5', v: 'Aliya Sem 5'}, {k: 'wafy_aliya_sem6', v: 'Aliya Sem 6'},
                {k: 'wafy_aliya_sem7', v: 'Aliya Sem 7'}, {k: 'wafy_aliya_sem8', v: 'Aliya Sem 8'}
            ],
            // Specific Column Order for Wafy
            columns: [
                { key: 'subject', label: 'Subject' }, 
                { key: 'ce_mark', label: 'CE Mark' }, { key: 'ce_max', label: 'CE Max' },
                { key: 'te_mark', label: 'TE Mark' }, { key: 'te_max', label: 'TE Max' },
                { key: 'total', label: 'Total' }, { key: 'max', label: 'Max' },
                { key: 'status', label: 'Status' }, { key: 'exam_mode', label: 'Exam Mode' },
                { key: 'percentage', label: 'Percentage' } // Calculated
            ]
        },
        degree: {
            sems: [
                {k: 'degree_sem1', v: 'Degree Sem 1'}, {k: 'degree_sem2', v: 'Degree Sem 2'},
                {k: 'degree_sem3', v: 'Degree Sem 3'}, {k: 'degree_sem4', v: 'Degree Sem 4'},
                {k: 'degree_sem5', v: 'Degree Sem 5'}, {k: 'degree_sem6', v: 'Degree Sem 6'}
            ],
            columns: [
                { key: 'subject', label: 'Subject' }, { key: 'credits', label: 'Credits' },
                { key: 'grade', label: 'Grade' }, { key: 'credit_point', label: 'Credit Point' }, { key: 'status', label: 'Status' }
            ]
        },
        highersec: {
            sems: [
                {k: 'highersec_plus1', v: 'Plus One'}, {k: 'highersec_plus2', v: 'Plus Two'}
            ],
            columns: [
                { key: 'subject', label: 'Subject' }, { key: 'ce_mark', label: 'CE Mark' }, { key: 'ce_max', label: 'CE Max' },
                { key: 'te_mark', label: 'TE Mark' }, { key: 'te_max', label: 'TE Max' }, { key: 'total', label: 'Total' }, { key: 'max', label: 'Max' }
            ]
        }
    };

    let currentConfig = [];

    function updateSemesterOptions() {
        const type = document.getElementById('courseType').value;
        const semSelect = document.getElementById('semesterSelect');
        semSelect.innerHTML = '<option value="">-- Select Semester --</option>';
        
        if (type && CONFIG[type]) {
            CONFIG[type].sems.forEach(sem => {
                semSelect.innerHTML += `<option value="${sem.k}">${sem.v}</option>`;
            });
            semSelect.disabled = false;
        } else {
            semSelect.disabled = true;
        }
    }

    async function fetchAllResults() {
        const semKey = document.getElementById('semesterSelect').value;
        const type = document.getElementById('courseType').value;
        
        if (!semKey) return alert("Please select a semester.");
        
        const semLabel = document.getElementById('semesterSelect').options[document.getElementById('semesterSelect').selectedIndex].text;
        currentConfig = CONFIG[type].columns;

        document.getElementById('loadingSpinner').style.display = 'block';
        document.getElementById('resultsContainer').innerHTML = '';

        // 1. Fetch Results
        const { data: results, error } = await supabase
            .from('semester_results')
            .select('student_id, results_data')
            .eq('semester_key', semKey);

        if (error) {
            document.getElementById('loadingSpinner').style.display = 'none';
            return alert("Error: " + error.message);
        }

        if (!results || results.length === 0) {
            document.getElementById('loadingSpinner').style.display = 'none';
            document.getElementById('resultsContainer').innerHTML = `<div class="alert alert-warning text-center">No results found for ${semLabel}.</div>`;
            return;
        }

        // 2. Fetch Student Info
        const studentIds = results.map(r => r.student_id);
        const { data: students, error: stuError } = await supabase
            .from('students')
            .select('id, full_name, cic_no')
            .in('id', studentIds);

        if (stuError) return alert("Error fetching students.");

        const studentMap = {};
        students.forEach(s => studentMap[s.id] = s);

        // 3. Combine & Sort
        let allData = [];
        results.forEach(r => {
            const student = studentMap[r.student_id];
            if (student) {
                allData.push({
                    student: student,
                    results: r.results_data,
                    isWafy: type === 'wafy'
                });
            }
        });

        // Sort by CIC
        allData.sort((a, b) => a.student.cic_no.localeCompare(b.student.cic_no));

        // 4. Render All Tables
        renderReportCards(allData, semLabel);
    }

    function renderReportCards(allData, semLabel) {
        const container = document.getElementById('resultsContainer');
        
        allData.forEach(data => {
            const s = data.student;
            const isWafy = data.isWafy;
            
            // Build Table Block for ONE student
            const block = document.createElement('div');
            block.className = 'student-result-block';
            
            // Header for the student
            let headerHtml = `
                <div class="student-header">
                    <div class="student-info">
                        <h4>${s.full_name}</h4>
                        <span>CIC No: <strong>${s.cic_no}</strong></span>
                    </div>
                    <div class="text-right text-muted">
                        <h5>${semLabel}</h5>
                    </div>
                </div>
            `;

            // Table Body
            let tableHtml = `
                <div class="table-responsive">
                    <table class="table table-bordered table-striped table-hover text-center">
                        <thead class="thead-light">
                            <tr>${currentConfig.map(c => `<th>${c.label}</th>`).join('')}</tr>
                        </thead>
                        <tbody>
            `;

            data.results.forEach(row => {
                let tr = '<tr>';
                let percentage = 0;
                let isFail = false;

                // Helper
                const getVal = (k) => row[k] || row[k.toLowerCase()] || row[k.replace(/_/g, ' ')] || '';

                // Wafy Logic
                if(isWafy) {
                    const total = parseFloat(getVal('total'));
                    const max = parseFloat(getVal('max') || getVal('max_mark'));
                    if(!isNaN(total) && !isNaN(max) && max > 0) {
                        percentage = (total/max)*100;
                    }
                    // Mark red if < 45%
                    if(percentage < 45) isFail = true;
                }

                // Render Cells
                currentConfig.forEach(col => {
                    if (col.key === 'percentage') {
                        const pText = percentage > 0 ? percentage.toFixed(1) + '%' : '-';
                        tr += `<td class="percentage-col ${isFail ? 'mark-low' : ''}">${pText}</td>`;
                    } else {
                        let val = getVal(col.key);
                        // Highlight 'Total' if failed (Wafy only)
                        if (isWafy && col.key === 'total' && isFail) {
                            tr += `<td class="mark-low">${val}</td>`;
                        } else {
                            tr += `<td>${val}</td>`;
                        }
                    }
                });
                tr += '</tr>';
                tableHtml += tr;
            });

            tableHtml += `</tbody></table></div>`;
            
            block.innerHTML = headerHtml + tableHtml;
            container.appendChild(block);
        });

        document.getElementById('loadingSpinner').style.display = 'none';
    }
</script>
</body>
</html>
