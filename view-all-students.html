<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>View All Students - الأبطال</title>
    <link rel="stylesheet" href="sc.css" />
    <link rel="stylesheet" href="view-all-students.css"/>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <!-- Supabase Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light fixed-top">
        <a class="navbar-brand" href="index.html"><img src="https://res.cloudinary.com/dh5jui6pu/image/upload/v1751959954/Screenshot_2025-07-08_130148_kg3qdg.png" class="navimg" /></a>
        <button class="navbar-toggler" style="width: 60px;" type="button" data-toggle="collapse" data-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ml-auto">
                <li class="nav-item"><a class="nav-link" href="main.html">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="students-info.html">Students Info</a></li>
                <li class="nav-item active"><a class="nav-link" href="students-progress.html">Students Progress</a></li>
                <li class="nav-item"><a class="nav-link" href="council.html">Our Council</a></li>
            </ul>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container mt-5 mb-5" style="margin-top: 100px !important;">
        <div class="row">
            <div class="col-12">
                <h1 class="text-center mb-5" style="font-family: Almarai; color: #02244e;">All Students</h1>
            </div>
        </div>

        <!-- Search and Filter Section -->
        <div class="row mb-4">
            <div class="col-12 col-md-6">
                <div class="form-group">
                    <input type="text" class="form-control" id="searchInput" placeholder="Search by CIC No. or Name..." style="font-family: Almarai;">
                </div>
            </div>
            <div class="col-12 col-md-6 text-right">
                <button class="btn btn-primary" onclick="refreshStudents()" style="font-family: Almarai;">
                    <i class="fas fa-sync-alt"></i> Refresh
                </button>
            </div>
        </div>

        <!-- Students Count -->
        <div class="row mb-3">
            <div class="col-12">
                <div class="alert alert-info" role="alert">
                    <i class="fas fa-users"></i>
                    <strong>Total Students:</strong> <span id="studentCount">0</span>
                </div>
                <div id="fetchError" class="alert alert-danger" role="alert" style="display:none; white-space: pre-wrap;"></div>
            </div>
        </div>

        <!-- Header Row -->
        <div class="row mb-3">
            <div class="col-12">
                <div class="card students-card">
                    <div class="card-body">
                        <div class="row align-items-center table-head">
                            <div class="col-2 text-center">
                                <h5 style="font-family: Almarai; color: #02244e; margin: 0; font-weight: bold;">SL No.</h5>
                            </div>
                            <div class="col-3 text-center">
                                <h5 style="font-family: Almarai; color: #02244e; margin: 0; font-weight: bold;">CIC No.</h5>
                            </div>
                            <div class="col-5 text-center">
                                <h5 style="font-family: Almarai; color: #02244e; margin: 0; font-weight: bold;">Name</h5>
                            </div>
                            <div class="col-2 text-center">
                                <h5 style="font-family: Almarai; color: #02244e; margin: 0; font-weight: bold;">Action</h5>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Students List -->
        <div class="row" id="studentsList">
            <!-- Students will be loaded here dynamically -->
        </div>

        <!-- No Students Message -->
        <div class="row" id="noStudentsMessage" style="display: none;">
            <div class="col-12 text-center">
                <div class="card students-card">
                    <div class="card-body">
                        <i class="fas fa-user-slash" style="font-size: 4rem; color: #6c757d; margin-bottom: 1rem;"></i>
                        <h3 style="font-family: Almarai; color: #6c757d;">No Students Found</h3>
                        <p style="font-family: Almarai; color: #6c757d;">No students have been added yet. Add some students to get started!</p>
                        <a href="manage-students.html" class="btn btn-primary btn-lg" style="font-family: Almarai;">
                            <i class="fas fa-plus"></i> Add Students
                        </a>
                    </div>
                </div>
            </div>
        </div>

        <!-- Back Button -->
        <div class="row mt-4">
            <div class="col-12 text-center">
                <a href="students-info.html" class="btn btn-secondary btn-lg" style="font-family: Almarai;">
                    <i class="fas fa-arrow-left"></i> Back to Students Info
                </a>
            </div>
        </div>
    </div>

    <!-- Student Details Modal -->
    <div class="modal fade" id="studentDetailsModal" tabindex="-1" role="dialog" aria-labelledby="studentDetailsModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="studentDetailsModalLabel" style="font-family: Almarai; color: #02244e;">
                        <i class="fas fa-user"></i> Student Details
                    </h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <!-- Basic Info -->
                    <div class="row">
                        <div class="col-md-6 form-group">
                            <label style="font-family: Almarai; color: #02244e; font-weight: bold;">CIC No.</label>
                            <p id="studentDetailCicNo" style="font-family: Almarai; color: #333; font-size: 1.1rem;"></p>
                        </div>
                        <div class="col-md-6 form-group">
                            <label style="font-family: Almarai; color: #02244e; font-weight: bold;">Full Name</label>
                            <p id="studentDetailName" style="font-family: Almarai; color: #333; font-size: 1.1rem;"></p>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 form-group">
                            <label style="font-family: Almarai; color: #02244e; font-weight: bold;">Admission No.</label>
                            <p id="studentDetailAdmissionNo" style="font-family: Almarai; color: #333; font-size: 1.1rem;"></p>
                        </div>
                        <div class="col-md-6 form-group">
                            <label style="font-family: Almarai; color: #02244e; font-weight: bold;">Date of Birth</label>
                            <p id="studentDetailDob" style="font-family: Almarai; color: #333; font-size: 1.1rem;"></p>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 form-group">
                            <label style="font-family: Almarai; color: #02244e; font-weight: bold;">Guardian Name</label>
                            <p id="studentDetailGuardianName" style="font-family: Almarai; color: #333; font-size: 1.1rem;"></p>
                        </div>
                        <div class="col-md-6 form-group">
                            <label style="font-family: Almarai; color: #02244e; font-weight: bold;">Occupation</label>
                            <p id="studentDetailOccupation" style="font-family: Almarai; color: #333; font-size: 1.1rem;"></p>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 form-group">
                            <label style="font-family: Almarai; color: #02244e; font-weight: bold;">Email ID</label>
                            <p id="studentDetailEmail" style="font-family: Almarai; color: #333; font-size: 1.1rem;"></p>
                        </div>
                        <div class="col-md-6 form-group">
                            <label style="font-family: Almarai; color: #02244e; font-weight: bold;">Phone No.</label>
                            <p id="studentDetailPhoneNo" style="font-family: Almarai; color: #333; font-size: 1.1rem;"></p>
                        </div>
                    </div>
                    
                    <div class="row">
                        <div class="col-12 form-group">
                            <label style="font-family: Almarai; color: #02244e; font-weight: bold;">Address</label>
                            <p id="studentDetailAddress" style="font-family: Almarai; color: #333; font-size: 1.1rem;"></p>
                        </div>
                    </div>

                    <hr>
                    
                    <!-- Leaves Section -->
                    <h5 class="text-muted mb-3">Attendance Record</h5>
                    <div class="row">
                        <div class="col-md-6 form-group">
                            <label style="font-family: Almarai; color: #02244e; font-weight: bold;">Total Leaves</label>
                            <p id="studentDetailTotalLeaves" style="font-family: Almarai; color: #333; font-size: 1.1rem;">-</p>
                        </div>
                        <div class="col-md-6 form-group">
                            <label style="font-family: Almarai; color: #02244e; font-weight: bold;">Medical Leaves</label>
                            <p id="studentDetailMedicalLeaves" style="font-family: Almarai; color: #333; font-size: 1.1rem;">-</p>
                        </div>
                    </div>

                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal" style="font-family: Almarai;">
                        <i class="fas fa-times"></i> Close
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <script>
        // Supabase config
        const supabase = window.supabaseClient;
        let studentsCache = [];

        if (!supabase || !supabase.from) {
        console.error("Supabase client not initialized! Check config.js");
        }
        async function fetchStudents() {
            try {
                // Fetch all students
                const { data, error } = await supabase
                    .from('students')
                    .select('id, cic_no, full_name, admission_no, dob, guardian_name, occupation, address, phone_no, email_id')
                    .order('cic_no', { ascending: true });

                if (error) {
                    console.error('Supabase error:', error);
                    showFetchError(error);
                    studentsCache = [];
                    return studentsCache;
                }

                studentsCache = data || [];
                return studentsCache;
            } catch (err) {
                console.error('Network/JS error fetching students', err);
                showFetchError(err);
                studentsCache = [];
                return studentsCache;
            }
        }

        // Separate function to fetch leaves for a single student
        async function fetchLeaves(studentId) {
            const { data, error } = await supabase
                .from('student_leaves')
                .select('total_leaves, medical_leaves')
                .eq('student_id', studentId)
                .single();
            
            if (error || !data) return { total_leaves: 0, medical_leaves: 0 };
            return data;
        }

        function showFetchError(err) {
            const el = document.getElementById('fetchError');
            if (!el) return;
            el.style.display = 'block';
            const msg = (err && err.message) ? err.message : JSON.stringify(err);
            el.textContent = 'Unable to load students.\n' + msg + '\n(See console for full details)';
        }

        function clearFetchError() {
            const el = document.getElementById('fetchError');
            if (!el) return;
            el.style.display = 'none';
            el.textContent = '';
        }

        function escapeHtml(s) {
            return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
        }

        function displayStudents(students = null) {
            clearFetchError();
            const list = (students || studentsCache).slice();
            list.sort((a,b) => String(a.cic_no || '').localeCompare(String(b.cic_no || '')));

            const studentsList = document.getElementById('studentsList');
            const noStudentsMessage = document.getElementById('noStudentsMessage');
            const studentCount = document.getElementById('studentCount');

            studentCount.textContent = list.length;
            if (list.length === 0) {
                studentsList.innerHTML = '';
                noStudentsMessage.style.display = 'block';
                return;
            }

            noStudentsMessage.style.display = 'none';
            studentsList.innerHTML = '';

            list.forEach((student, idx) => {
                const row = document.createElement('div');
                row.className = 'col-12 mb-3';
                row.innerHTML = `
                    <div class="card students-card">
                        <div class="card-body">
                            <div class="row align-items-center">
                                <div class="col-2 text-center"><h5 style="margin:0">${idx+1}</h5></div>
                                <div class="col-3 text-center"><h5 style="margin:0">${escapeHtml(student.cic_no)}</h5></div>
                                <div class="col-5 text-center"><h5 style="margin:0">${escapeHtml(student.full_name)}</h5></div>
                                <div class="col-2 text-center"><button class="btn btn-info btn-sm action-btn" type="button" onclick="showStudentDetails('${encodeURIComponent(String(student.cic_no || ''))}')">View</button></div>
                            </div>
                        </div>
                    </div>
                `;
                studentsList.appendChild(row);
            });
        }

        function searchStudents() {
            const term = document.getElementById('searchInput').value.trim().toLowerCase();
            if (!term) return displayStudents();
            const filtered = studentsCache.filter(s => (s.full_name||'').toLowerCase().includes(term) || (String(s.cic_no||'')).toLowerCase().includes(term));
            displayStudents(filtered);
        }

        async function refreshStudents() {
            await fetchStudents();
            displayStudents();
            document.getElementById('searchInput').value = '';
        }

        function getQueryParam(key) {
            return new URLSearchParams(window.location.search).get(key);
        }

        async function showStudentDetails(encodedCic) {
            const cic = decodeURIComponent(encodedCic || '');
            const student = studentsCache.find(s => String(s.cic_no) === cic);
            if (!student) return alert('Student not found: ' + cic);

            // 1. Populate Basic Info
            document.getElementById('studentDetailCicNo').textContent = student.cic_no || '';
            document.getElementById('studentDetailName').textContent = student.full_name || '';
            document.getElementById('studentDetailAdmissionNo').textContent = student.admission_no || 'Not provided';
            document.getElementById('studentDetailDob').textContent = student.dob || 'Not provided';
            document.getElementById('studentDetailGuardianName').textContent = student.guardian_name || 'Not provided';
            document.getElementById('studentDetailOccupation').textContent = student.occupation || 'Not provided';
            document.getElementById('studentDetailEmail').textContent = student.email_id || 'Not provided';
            document.getElementById('studentDetailPhoneNo').textContent = student.phone_no || 'Not provided';
            document.getElementById('studentDetailAddress').textContent = student.address || 'Not provided';

            // 2. Fetch & Populate Leaves
            const leaves = await fetchLeaves(student.id);
            document.getElementById('studentDetailTotalLeaves').textContent = leaves.total_leaves;
            document.getElementById('studentDetailMedicalLeaves').textContent = leaves.medical_leaves;

            $('#studentDetailsModal').modal('show');
        }

        document.addEventListener('DOMContentLoaded', async function() {
            await fetchStudents();
            displayStudents();
            document.getElementById('searchInput').addEventListener('input', searchStudents);

            const cicFromQuery = getQueryParam('cicNo');
            if (cicFromQuery) showStudentDetails(cicFromQuery);
        });
    </script>
</body>

</html>
