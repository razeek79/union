<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Manage Officials</title>
    <link rel="stylesheet" href="sc.css" />
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <script>
        // --- SECURITY CHECK ---
        const role = localStorage.getItem('mgmtUserRole');
        if (role !== 'chief_admin') {
            alert('Access Restricted: Chief Admin Only');
            window.location.href = 'rk-login.html';
        }
    </script>

    <nav class="navbar navbar-expand-lg navbar-light bg-light fixed-top">
        <a class="navbar-brand" href="index.html"><img src="https://res.cloudinary.com/dh5jui6pu/image/upload/v1751959954/Screenshot_2025-07-08_130148_kg3qdg.png" class="navimg" /></a>
    </nav>

    <div class="container" style="margin-top:120px;">
        <div class="row">
            <div class="col-12">
                <h3 class="mb-4 text-center">Manage Officials</h3>
                
                <a href="add-official.html" class="btn btn-success w-100 mb-3">Add New Official</a>
                <div class="card students-card">
                    <div class="card-header">
                        <h5>Current Officials List</h5>
                    </div>
                    <div class="card-body">
                        <div id="officialsList">
                            <p class="text-muted">Loading officials...</p>
                        </div>
                    </div>
                </div>
                
                <a href="chief-admin-main.html" class="btn btn-secondary btn-block mt-3">Back</a>
            </div>
        </div>
    </div>

    <script>
        const supabaseUrl = 'https://ewpmkjqcjnhtxyfqgiba.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV3cG1ranFjam5odHh5ZnFnaWJhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjIzMTUyOTMsImV4cCI6MjA3Nzg5MTI5M30.i1ivEtua8fCktdit_DASxQigFg2Kb8NLn0WLLQ3LFmI';
        const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

        async function loadOfficials() {
            const { data, error } = await supabase.from('officials').select('*');
            const container = document.getElementById('officialsList');
            
            if (error) {
                container.innerHTML = '<p class="text-danger">Error loading officials: ' + error.message + '</p>';
                return;
            }

            if (!data || data.length === 0) {
                container.innerHTML = '<p class="text-muted">No officials found.</p>';
                return;
            }

            let html = '<ul class="list-group">';
            data.forEach(official => {
                // We don't show the Chief Admin in the "to delete" list usually, or we mark them special
                const isChief = official.role === 'chief_admin';
                html += `<li class="list-group-item d-flex justify-content-between align-items-center">
                            <span>
                                <strong>${official.username}</strong> 
                                <span class="badge badge-primary ml-2">${official.role}</span>
                            </span>
                            ${!isChief ? `<button class="btn btn-sm btn-danger" onclick="removeOfficial('${official.id}')">Remove</button>` : ''}
                         </li>`;
            });
            html += '</ul>';
            container.innerHTML = html;
        }

        async function removeOfficial(id) {
            if(!confirm("Are you sure? This will remove their access.")) return;
            
            // 1. Delete from officials table
            const { error } = await supabase.from('officials').delete().eq('id', id);
            
            if(error) {
                alert("Error: " + error.message);
            } else {
                alert("Official removed.");
                loadOfficials(); // Refresh list
                // Note: This keeps the login user in Auth (ghost user), but revokes their access rights since they are gone from the table.
            }
        }

        loadOfficials();
    </script>
</body>
</html>
